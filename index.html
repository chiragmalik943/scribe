<!doctype html>
<html lang="en" data-th="ocean" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIT-Scribe — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════ tokens ══════════════════════════════ */
/* Two axes. `data-th` on <html> picks the THEME (its own nine-step brand ramp and
   its own neutrals); `data-theme` picks LIGHT or DARK within that theme. So each
   theme ships a hand-tuned dark set rather than an inversion of its light one.

   Every theme block defines the same list:
     o50…o800   the brand ramp, light→dark in light mode, dark→light in dark mode
     rail/surf/sunk/backdrop   surfaces, lightest content surface is `surf`
     line/line2 ink/ink2/sec/ter
     brand*     brand as FILL (brandFill + brandOn) vs brand as INK (brandInk)
     tint/tint2 tinted surfaces for active rows and icon wells
     onChip     chip background sitting on top of a brand fill
     meterOff/ring/scrim

   Rule of thumb: orange-as-fill uses o500-ish, orange-as-ink uses o700-ish.
   Citrus breaks that on purpose — its brand IS a pale lime, so the fill is light
   and `brandOn` is dark ink in both modes.

   Status colours (danger / warn / ok / info) and the shadows are shared across
   themes so a red always reads as a red, and live in the two blocks below. */
:root{
  --danger:#D92D20; --dangerOn:#FFFFFF; --dangerInk:#B42318; --dangerTint:#FEF3F1; --dangerLine:#FADBD5;
  --warn:#DD9000; --warnInk:#8A5300; --warnTint:#FFF8E8; --warnLine:#F6E2BC;
  --ok:#0A7548; --okInk:#07603B; --okTint:#ECFAF3; --okLine:#C8E9D7;
  --info:#1570EF; --infoTint:#EFF5FF; --infoInk:#0B4FB0; --infoLine:#CFE0FB;
  --shadow:0 24px 70px rgba(26,24,32,.20),0 2px 8px rgba(26,24,32,.09);
  --shadow2:0 16px 40px rgba(26,24,32,.15);
}
[data-theme="dark"]{
  --danger:#F0483A; --dangerOn:#26100C; --dangerInk:#FFA79B; --dangerTint:#3A1713; --dangerLine:#55231C;
  --warn:#E9A23B; --warnInk:#F7CD82; --warnTint:#33240D; --warnLine:#4B3616;
  --ok:#17A46A; --okInk:#6FDCA6; --okTint:#0F2A1D; --okLine:#1F4632;
  --info:#5B95F0; --infoTint:#15233A; --infoInk:#A8C8F8; --infoLine:#274068;
  --shadow:0 24px 70px rgba(0,0,0,.58),0 2px 8px rgba(0,0,0,.42);
  --shadow2:0 16px 40px rgba(0,0,0,.46);
}

/* ─────────── Ocean — cool blue, the default ─────────── */
:root,[data-th="ocean"]{
  --o50:#F3F8FF; --o100:#E4EFFE; --o200:#C7DDFC; --o300:#8FB8F8;
  --o400:#4B8BF0; --o500:#1A5FE0; --o600:#0548CF; --o700:#0A3AA0; --o800:#0A2C74;
  --rail:#F9FBFE; --surf:#FFFFFF; --sunk:#F4F8FE; --scrim:rgba(12,25,43,.42);
  --line:#E5EDF8; --line2:#D3E0F1;
  --ink:#0F1B2C; --ink2:#2C3D53; --sec:#5D7189; --ter:#8497AC;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o700); --brandInk:var(--o700);
  --brandFill:var(--o600); --brandFillHov:var(--o700);
  --tint:var(--o100); --tint2:var(--o50); --onChip:rgba(0,0,0,.24);
  --backdrop:#E3EAF3; --meterOff:#CFDDEF; --ring:rgba(26,95,224,.22);
}
[data-th="ocean"][data-theme="dark"]{
  --o50:#0F1E33; --o100:#132842; --o200:#1C3A5E; --o300:#27528A;
  --o400:#215EE0; --o500:#4C8DF5; --o600:#71A6F8; --o700:#9BC1FB; --o800:#C4DBFD;
  --rail:#101C2E; --surf:#0D192B; --sunk:#152438; --scrim:rgba(0,0,0,.62);
  --line:#1D2E46; --line2:#2A3E59;
  --ink:#EFF5FD; --ink2:#D3E0EE; --sec:#94A9C0; --ter:#7488A0;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o600); --brandInk:var(--o600);
  --brandFill:var(--o400); --brandFillHov:var(--o500);
  --tint:var(--o200); --tint2:var(--o100); --onChip:rgba(0,0,0,.28);
  --backdrop:#060C16; --meterOff:#2C4260; --ring:rgba(76,141,245,.30);
}

/* ─────────── Citrus — warm neutrals, pale lime brand ───────────
   The only theme whose brand fill is lighter than its text, so brandOn is dark
   ink in both modes and onChip goes white rather than black. */
[data-th="citrus"]{
  --o50:#FAFDEC; --o100:#F0F8C2; --o200:#E1FA79; --o300:#C8E552;
  --o400:#A6C531; --o500:#86A31C; --o600:#6B8415; --o700:#4F6310; --o800:#38470B;
  --rail:#F9F9F4; --surf:#FFFFFF; --sunk:#F6F7EE; --scrim:rgba(28,32,18,.42);
  --line:#EBEDDF; --line2:#DCDFCB;
  --ink:#191C10; --ink2:#353A26; --sec:#6B7059; --ter:#8F9478;
  --brand:var(--o400); --brandOn:#243005; --brandHov:var(--o300); --brandInk:var(--o700);
  --brandFill:var(--o200); --brandFillHov:var(--o300);
  --tint:var(--o100); --tint2:var(--o50); --onChip:rgba(255,255,255,.62);
  --backdrop:#E8E9DC; --meterOff:#D7DBC3; --ring:rgba(166,197,49,.32);
}
[data-th="citrus"][data-theme="dark"]{
  --o50:#1A2413; --o100:#26331A; --o200:#3E4D2A; --o300:#5C7238;
  --o400:#8CB03F; --o500:#BDE55E; --o600:#E1FA79; --o700:#EBFCA3; --o800:#F4FDC9;
  --rail:#141C11; --surf:#18261D; --sunk:#1F2E22; --scrim:rgba(0,0,0,.64);
  --line:#26362A; --line2:#35483A;
  --ink:#F1F7E9; --ink2:#DCE6D2; --sec:#9CAC91; --ter:#7E8E74;
  --brand:var(--o500); --brandOn:#1B2607; --brandHov:var(--o700); --brandInk:var(--o600);
  --brandFill:var(--o600); --brandFillHov:var(--o700);
  --tint:var(--o200); --tint2:var(--o100); --onChip:rgba(255,255,255,.42);
  --backdrop:#0B1109; --meterOff:#33452F; --ring:rgba(225,250,121,.28);
}

/* ─────────── Harbor — muted steel blue, low glare ─────────── */
[data-th="harbor"]{
  --o50:#F4F7FB; --o100:#E3EAF3; --o200:#CFD9E9; --o300:#A3B6D0;
  --o400:#6E8CB4; --o500:#4A6E9C; --o600:#365B90; --o700:#2A4772; --o800:#1E3455;
  --rail:#F2F3F6; --surf:#FFFFFF; --sunk:#F5F7FA; --scrim:rgba(20,30,42,.44);
  --line:#E6E9EF; --line2:#D5DAE3;
  --ink:#141C26; --ink2:#333E4C; --sec:#606C7C; --ter:#8792A1;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o700); --brandInk:var(--o700);
  --brandFill:var(--o600); --brandFillHov:var(--o700);
  --tint:var(--o200); --tint2:var(--o100); --onChip:rgba(0,0,0,.24);
  --backdrop:#E4E7ED; --meterOff:#CBD3DF; --ring:rgba(54,91,144,.26);
}
[data-th="harbor"][data-theme="dark"]{
  --o50:#141E2B; --o100:#1B2938; --o200:#26384C; --o300:#345078;
  --o400:#3F6394; --o500:#5A85BE; --o600:#83A8D6; --o700:#A9C4E5; --o800:#CBDCF0;
  --rail:#182332; --surf:#141E2A; --sunk:#1B2836; --scrim:rgba(0,0,0,.64);
  --line:#23303F; --line2:#324152;
  --ink:#EAEFF5; --ink2:#CFD9E4; --sec:#8E9DAF; --ter:#75849A;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o600); --brandInk:var(--o600);
  --brandFill:#32558A; --brandFillHov:var(--o400);
  --tint:var(--o300); --tint2:var(--o200); --onChip:rgba(0,0,0,.30);
  --backdrop:#0A1017; --meterOff:#2E3E52; --ring:rgba(90,133,190,.30);
}

/* ─────────── Violet — deep indigo, violet accent ─────────── */
[data-th="violet"]{
  --o50:#F6F4FE; --o100:#EAE6FD; --o200:#DCD7FD; --o300:#B7A8FA;
  --o400:#8B72F2; --o500:#6B45EC; --o600:#5323E3; --o700:#4318BE; --o800:#331293;
  --rail:#F2EFFE; --surf:#FFFFFF; --sunk:#F7F5FE; --scrim:rgba(22,16,48,.44);
  --line:#EAE7F7; --line2:#DAD5EE;
  --ink:#16112B; --ink2:#332C4E; --sec:#6A6386; --ter:#8D86A6;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o700); --brandInk:var(--o700);
  --brandFill:var(--o600); --brandFillHov:var(--o700);
  --tint:var(--o100); --tint2:var(--o50); --onChip:rgba(0,0,0,.26);
  --backdrop:#E6E2F3; --meterOff:#D6CFF0; --ring:rgba(107,69,236,.26);
}
[data-th="violet"][data-theme="dark"]{
  --o50:#161A38; --o100:#1E2148; --o200:#282A5E; --o300:#32217D;
  --o400:#5A2AEB; --o500:#7C5CF5; --o600:#9C84F9; --o700:#BCACFC; --o800:#DAD0FE;
  --rail:#191A3F; --surf:#10142E; --sunk:#181B3B; --scrim:rgba(0,0,0,.66);
  --line:#232748; --line2:#32365C;
  --ink:#F2EFFE; --ink2:#DAD4EE; --sec:#9B95BC; --ter:#7F79A0;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o600); --brandInk:var(--o600);
  --brandFill:var(--o400); --brandFillHov:var(--o500);
  --tint:var(--o300); --tint2:var(--o200); --onChip:rgba(0,0,0,.30);
  --backdrop:#080A1C; --meterOff:#2F3160; --ring:rgba(124,92,245,.32);
}

/* ─────────── Ember — the original orange ─────────── */
[data-th="ember"]{
  --o50:#FFF6F1; --o100:#FFEADF; --o200:#FFD2BC; --o300:#FF9F6D;
  --o400:#FF7A33; --o500:#FF5D00; --o600:#E85200; --o700:#B84300; --o800:#8E3300;
  --rail:#FFF7F2; --surf:#FFFFFF; --sunk:#FDF4EE; --scrim:rgba(36,22,14,.38);
  --line:#F3E4DA; --line2:#E7D4C7;
  --ink:#231710; --ink2:#463730; --sec:#77645A; --ter:#9A8477;
  --brand:var(--o500); --brandOn:#FFFFFF; --brandHov:var(--o600); --brandInk:var(--o700);
  --brandFill:var(--o600); --brandFillHov:var(--o700);
  --tint:var(--o100); --tint2:var(--o50); --onChip:rgba(0,0,0,.24);
  --backdrop:#EBE2DA; --meterOff:#EBD8CB; --ring:rgba(255,93,0,.22);
}
[data-th="ember"][data-theme="dark"]{
  --o50:#2A1408; --o100:#3B1C0B; --o200:#59290F; --o300:#8C3D12;
  --o400:#D14E00; --o500:#FF6A1A; --o600:#FF8340; --o700:#FF9E6B; --o800:#FFC2A1;
  --rail:#17110C; --surf:#1E1712; --sunk:#292018; --scrim:rgba(0,0,0,.62);
  --line:#33271F; --line2:#443429;
  --ink:#FAF3ED; --ink2:#E7DAD1; --sec:#B8A497; --ter:#9C8778;
  --brand:var(--o500); --brandOn:#1A1005; --brandHov:var(--o600); --brandInk:var(--o700);
  --brandFill:var(--o500); --brandFillHov:var(--o600);
  --tint:var(--o100); --tint2:var(--o50); --onChip:rgba(0,0,0,.24);
  --backdrop:#0A0705; --meterOff:#4A382B; --ring:rgba(255,106,26,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,'Liberation Sans',Arial,sans-serif;background:var(--backdrop);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:background .25s}
.h{font-family:Poppins,sans-serif}
svg{display:block;flex:0 0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ══════════════════════════════ window frame ══════════════════════════════ */
#frame{position:relative;width:1440px;height:900px;background:var(--surf);border-radius:14px;overflow:hidden;
  box-shadow:0 40px 100px rgba(40,20,8,.26),0 0 0 1px rgba(40,20,8,.07);
  transform-origin:center center;transition:background .25s}
/* the mock window gives up its frame and fills the viewport once the browser
   gets too small to show it comfortably at 1440×900 */
#frame.fill{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
#app{height:100%}
.shell{display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
.app{display:flex;flex:1;min-height:0;position:relative}

/* ══════════════════════════════ window title bar ══════════════════════════════ */
.topbar{height:64px;flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:0 16px 0 20px;background:var(--surf);border-bottom:1px solid var(--line);z-index:6}
.topbar .ttl{display:flex;align-items:baseline;gap:11px;min-width:0}
.topbar h1{font-family:Poppins,sans-serif;font-size:22px;font-weight:600;
  letter-spacing:-.015em;white-space:nowrap}
.topbar .state{font-size:13.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}

/* ══════════════════════════════ rail (sidebar 1) ══════════════════════════════ */
.rail{width:260px;flex:0 0 260px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 14px 14px;overflow:hidden;
  transition:width .18s,flex-basis .18s,background .25s}
.app.railmin .rail{width:72px;flex:0 0 72px;padding:14px 8px}
.app.railmin .rail .lbl,.app.railmin .rail .slab,.app.railmin .rail .acct .who,
.app.railmin .rail .upg,.app.railmin .subnav,.app.railmin .rail .colbtn b{display:none}
.app.railmin .nav a{justify-content:center;padding:0;width:44px;height:44px;margin:0 auto}
.app.railmin .rail .colbtn{justify-content:center;padding:0;width:44px;height:40px;margin:0 auto}
.app.railmin .acct{border:0;background:transparent;padding:0;justify-content:center;box-shadow:none}
.app.railmin .acct .top{justify-content:center}
.app.railmin .avat{width:34px;height:34px;font-size:13px}
/* collapse / expand control, shared by both sidebars */
.colbtn{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;border-radius:10px;
  color:var(--sec);cursor:pointer;flex:0 0 auto}
.colbtn b{font-size:13px;font-weight:500;font-family:Inter,sans-serif;white-space:nowrap}
.colbtn:hover{background:var(--sunk);color:var(--ink2)}
.lights{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-right:4px}
.lights i{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:rgba(0,0,0,.5)}
.lights i svg{opacity:0;width:9px;height:9px}
.lights:hover i svg{opacity:1}
.lights .r{background:#FF5F57}.lights .y{background:#FEBC2E}.lights .g{background:#28C840}
[data-theme="dark"] .lights .r{background:#E0443E}[data-theme="dark"] .lights .y{background:#DEA123}
[data-theme="dark"] .lights .g{background:#1AAB29}
.tbtn:hover{background:var(--sunk)}
.slab{font-family:Poppins,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ter);padding:4px 12px 10px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:14px;height:40px;padding:0 12px;border-radius:10px;
  font-family:Poppins,sans-serif;font-size:14px;font-weight:500;color:var(--ink2);
  text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.nav a .ic{color:var(--sec)}
.nav a.on .ic{color:var(--brandInk)}
.subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 26px;
  border-left:1.5px solid var(--line2);padding-left:12px}
.subnav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;
  font-size:12.5px;color:var(--sec);cursor:pointer}
.subnav a:hover{background:var(--sunk)}
.subnav a.on{background:var(--tint2);color:var(--brandInk);font-weight:600}
.spacer{flex:1}
.acct{display:flex;align-items:center;padding:9px 10px;border-radius:14px;
  border:1px solid var(--line);background:var(--surf);overflow:hidden;flex:0 0 auto}
.acct .top{display:flex;align-items:center;gap:10px;min-width:0;width:100%}
.acct .who{min-width:0;flex:1}
.avat{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;
  font-size:12px;font-weight:600;flex:0 0 auto}
.acct .avat{width:32px;height:32px;background:var(--line);color:var(--ink2);font-size:13px}
.acct .nm{font-size:13px;font-weight:600;line-height:1.25;display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.acct .pl{font-size:11.5px;color:var(--sec);display:block}
.upg{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;
  font-family:Poppins,sans-serif;font-size:12px;font-weight:600;color:var(--brandInk);
  border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surf)}
.upg:hover{border-color:var(--brand);background:var(--tint2)}

/* ══════════════════════════════ list column (sidebar 2) ══════════════════════════════ */
.listcol{width:282px;flex:0 0 282px;background:var(--surf);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;transition:width .18s,flex-basis .18s}
/* collapsed: a narrow strip of icons rather than nothing at all */
.app.listmin .listcol{width:56px;flex:0 0 56px}
.app.listmin .listcol .lbl,.app.listmin .listcol .n,.app.listmin .listcol .pill,
.app.listmin .listcol .slabel,.app.listmin .listcol .note,.app.listmin .listcol input,
.app.listmin .listcol .convrow,.app.listmin .listcol .emptylist,
.app.listmin .listcol .lhead b,.app.listmin .listcol .colbtn b{display:none}
.app.listmin .srch{width:36px;height:36px;padding:0;margin:12px auto 0;justify-content:center;
  border-radius:10px;cursor:pointer}
.app.listmin .srch:hover{border-color:var(--brand);color:var(--brandInk)}
.app.listmin .lbody{padding:10px 10px 8px;align-items:center}
.app.listmin .views{width:100%;align-items:center}
.app.listmin .views a{width:36px;height:36px;min-height:36px;padding:0;justify-content:center;border-radius:10px}
.app.listmin .lhead{padding:0;justify-content:center}
.app.listmin .lhead .act{margin-left:0}
.app.listmin .listcol .colbtn{justify-content:center;padding:0;width:36px;margin:0 auto}
.lfoot{padding:6px 8px 10px;flex:0 0 auto}
.lhead{height:64px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lhead b{font-family:Poppins,sans-serif;font-size:15px;font-weight:600}
.lhead .act{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:Poppins,sans-serif;
  font-size:12.5px;font-weight:600;color:var(--brandInk)}
.srch{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line2);
  border-radius:8px;padding:8px 11px;margin:16px 16px 0;flex:0 0 auto}
.srch:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.srch input{font-size:13px;width:100%}
.srch input::placeholder{color:var(--ter)}
.lbody{padding:16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.views{display:flex;flex-direction:column;gap:2px}
.views a{display:flex;align-items:center;gap:12px;min-height:34px;padding:6px 10px;border-radius:8px;
  font-size:13.5px;color:var(--ink2);cursor:pointer}
.views a:hover{background:var(--sunk)}
.views a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.views a .ic{color:var(--sec)}
.views a.on .ic{color:var(--brandInk)}
.views a .n{margin-left:auto;font-size:12px;color:var(--sec)}
.views a.on .n{color:var(--brandInk);font-weight:700}
.views a .pill{margin-left:auto;font-size:11px;font-weight:700;color:var(--dangerOn);background:var(--danger);
  border-radius:10px;padding:1px 7px}
.slabel{font-family:Poppins,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ter);padding:18px 10px 8px}
.note{margin-top:14px;padding:11px 12px;border:1px dashed var(--line2);border-radius:10px;
  font-size:12px;color:var(--sec);line-height:1.45}
.emptylist{padding:28px 20px;text-align:center;font-size:12.5px;color:var(--sec);line-height:1.5}
.emptylist b{display:block;color:var(--ink2);font-size:13.5px;font-family:Poppins,sans-serif;
  font-weight:600;margin-bottom:6px}
.convrow{display:block;padding:11px 12px;border-radius:9px;cursor:pointer}
.convrow:hover{background:var(--sunk)}
.convrow.on{background:var(--tint)}
.convrow .t{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;display:block}
.convrow.on .t{color:var(--brandInk)}
.convrow .d{font-size:11.5px;color:var(--sec);margin-top:4px;display:block}

/* ══════════════════════════════ main ══════════════════════════════ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surf)}
.tbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--sec);position:relative;flex:0 0 auto;cursor:pointer}
.tbtn.hasbadge:after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;
  border-radius:50%;background:var(--danger);border:1.5px solid var(--surf)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--sec);min-width:0}
.crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .bk{cursor:pointer;display:flex;align-items:center;gap:6px}
.crumb .bk:hover{color:var(--brandInk)}
.crumb b{color:var(--ink);font-weight:600;font-family:Poppins,sans-serif;font-size:15px}
.body{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column}

/* ══════════════════════════════ buttons ══════════════════════════════ */
.btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-family:Poppins,sans-serif;
  font-size:13px;font-weight:600;border-radius:9px;padding:8px 15px;border:1px solid transparent;
  white-space:nowrap;cursor:pointer}
.btn.p{background:var(--brandFill);color:var(--brandOn);border-color:rgba(0,0,0,.07);
  box-shadow:0 1px 2px rgba(48,24,10,.10)}
.btn.p:hover{background:var(--brandFillHov);border-color:rgba(0,0,0,.10)}
.btn.s{background:var(--surf);color:var(--ink2);border-color:var(--line2)}
.btn.s:hover{background:var(--sunk)}
.btn.t{background:transparent;color:var(--brandInk);padding:7px 9px}
.btn.t:hover{background:var(--tint2)}
.btn.d{background:var(--danger);color:var(--dangerOn);border-color:rgba(0,0,0,.07)}
.btn.d:hover{filter:brightness(1.06)}
.btn.sm{font-size:12.5px;padding:6px 12px}
.btn.dis{background:var(--sunk);color:var(--ter);border-color:var(--line);cursor:not-allowed}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.link{font-family:Poppins,sans-serif;font-size:12.5px;font-weight:600;color:var(--brandInk);cursor:pointer}
.link:hover{text-decoration:underline}

/* ══════════════════════════════ generic ══════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty .ico{width:60px;height:60px;border-radius:50%;background:var(--tint2);display:flex;
  align-items:center;justify-content:center;color:var(--brand);margin-bottom:18px}
.empty h2{font-family:Poppins,sans-serif;font-size:20px;font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;color:var(--sec);line-height:1.6;max-width:470px}
.notice{display:flex;align-items:center;gap:11px;border-radius:12px;padding:12px 14px;
  font-size:13.5px;line-height:1.45}
.notice .act{margin-left:auto}
.notice.warn{background:var(--warnTint);border:1px solid var(--warnLine);color:var(--ink2)}
.notice.warn .ic{color:var(--warnInk)}
.notice.ok{background:var(--okTint);border:1px solid var(--okLine);color:var(--ink2)}
.notice.ok .ic{color:var(--okInk)}
.notice.dg{background:var(--dangerTint);border:1px solid var(--dangerLine);color:var(--ink2)}
.notice.dg .ic{color:var(--dangerInk)}
.kbd{flex:0 0 auto;font-size:12px;font-weight:700;background:var(--surf);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--ink);display:inline-block}
.ghd{display:flex;align-items:center;gap:8px;font-family:Poppins,sans-serif;font-size:11.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);margin:0 2px 10px}
.ghd.dg{color:var(--dangerInk)}
.ghd .n{color:var(--ter);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.meter{display:flex;align-items:center;gap:3px;height:38px;overflow:hidden}
.meter i{width:3px;border-radius:2px;background:var(--brand);transition:height .12s}
.meter.idle i{background:var(--meterOff)}
.meter.live i{background:var(--danger)}
.tog{width:44px;height:25px;border-radius:14px;background:var(--line2);position:relative;
  flex:0 0 auto;cursor:pointer;transition:background .16s}
.tog.on{background:var(--brand)}
.tog i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:left .16s}
.tog.on i{left:22px}
.tog.dis{opacity:.5;cursor:not-allowed}
.inp{border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13px;
  background:var(--surf);display:flex;align-items:center;gap:8px}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.inp input{width:100%}
.inp input::placeholder,.inp .ph{color:var(--ter)}
.sel{border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:13px;
  background:var(--surf);display:inline-flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.sel:hover{border-color:var(--brand)}
.cbx{width:18px;height:18px;border-radius:5px;border:1.8px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:var(--surf);cursor:pointer;color:transparent}
.cbx.on{background:var(--brand);border-color:var(--brand);color:var(--brandOn)}
.rdo{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--line2);flex:0 0 auto;cursor:pointer}
.rdo.on{border:5px solid var(--brand)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:6px;padding:2px 8px;font-family:Poppins,sans-serif;background:var(--sunk);color:var(--sec)}
.pri.hi{background:var(--dangerTint);color:var(--dangerInk)}
.pri.md{background:var(--warnTint);color:var(--warnInk)}
.pri.ok{background:var(--okTint);color:var(--okInk)}
.fchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);
  border:1px solid var(--line2);border-radius:9px;padding:7px 13px;background:var(--surf);
  cursor:pointer;white-space:nowrap}
.fchip:hover{background:var(--sunk)}
.fchip.on{background:var(--tint);color:var(--brandInk);font-weight:600;border-color:transparent}
.fchip .b{font-size:11px;font-weight:700;color:var(--dangerOn);background:var(--danger);
  border-radius:9px;padding:0 6px}
.fchip.on .b{background:var(--brand);color:var(--brandOn)}
/* ══════════════════════════════ meetings ══════════════════════════════ */
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow:hover{background:var(--sunk)}
.mrow .t{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;display:block}
.mrow .s{font-size:12.5px;color:var(--sec);display:block;margin-top:3px}
.mrow .rt{text-align:right;white-space:nowrap;flex:0 0 auto;min-width:118px}
.mrow .rt .tg{font-size:12px;font-weight:600;font-family:Poppins,sans-serif;display:block}
.mrow .rt .mt{font-size:12px;color:var(--sec);display:block;margin-top:4px}
.mrow>span:first-child{flex:1;min-width:0}
.mrow .macts{display:flex;gap:4px;flex:0 0 auto;opacity:0;pointer-events:none}
.mrow:hover .macts{opacity:1;pointer-events:auto}
.mrow .macts span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--sec);background:var(--surf);border:1px solid var(--line2)}
.mrow .macts span:hover{border-color:var(--brand);color:var(--brandInk)}
.mrow .macts span.dg:hover{border-color:var(--danger);color:var(--dangerInk)}
/* `live` doubles as a modifier on .meter and .holdbtn, so this stays scoped to
   the hosts that use it as a pill rather than becoming a bare .live rule */
.mrow .live,.dchips .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:var(--dangerOn);background:var(--danger);border-radius:20px;padding:2px 9px;font-family:Poppins,sans-serif}
.setuphd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.setuphd b{font-family:Poppins,sans-serif;font-size:14px}
.setuphd .step{font-size:12px;font-weight:600;color:var(--brandInk);background:var(--tint);
  padding:2px 9px;border-radius:20px}
.setuphd .x{margin-left:auto;color:var(--sec);cursor:pointer}
.setuprow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.setuprow+.setuprow{border-top:1px solid var(--line)}
.setuprow .si{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.setuprow .t{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;display:block}
.setuprow .s{font-size:12.5px;color:var(--sec);display:block;margin-top:3px;line-height:1.45;max-width:620px}
.setuprow .a{margin-left:auto;flex:0 0 auto}

/* ══════════════════════════════ meeting detail ══════════════════════════════ */
.titleblk{margin-bottom:16px}
.titleblk h1{font-family:Poppins,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.015em}
.titleblk h1 .edit{opacity:0;color:var(--sec);display:inline-flex;vertical-align:2px;margin-left:8px;
  pointer-events:none}
.titleblk:hover h1 .edit{opacity:1}
.metarow{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;color:var(--sec);flex-wrap:wrap}
.metarow .fchipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--ink2);font-weight:600;
  font-family:Poppins,sans-serif;cursor:pointer}
.metarow .fchipx:hover{border-color:var(--brand)}
.metarow .sp{width:3px;height:3px;border-radius:50%;background:var(--ter)}
.faces{display:flex;align-items:center}
.faces i{width:24px;height:24px;border-radius:50%;border:2px solid var(--surf);margin-left:-7px;
  font-style:normal;font-size:10.5px;font-weight:700;color:#FFFFFF;display:flex;align-items:center;
  justify-content:center;font-family:Poppins,sans-serif}
.faces i:first-child{margin-left:0}
.addp{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line2);border-radius:20px;
  padding:4px 11px 4px 9px;font-size:12.5px;color:var(--sec);cursor:pointer;
  font-family:Poppins,sans-serif;font-weight:600}
.addp:hover{border-color:var(--brand);color:var(--brandInk);border-style:solid}
.recbar{display:flex;align-items:center;gap:12px;background:var(--dangerTint);
  border:1px solid var(--dangerLine);border-radius:12px;padding:12px 16px}
.recbar.pause{background:var(--warnTint);border-color:var(--warnLine)}
.recbar .rdot{width:10px;height:10px;border-radius:50%;background:var(--danger);flex:0 0 auto;
  box-shadow:0 0 0 4px var(--dangerLine);animation:pulse 1.6s infinite}
.recbar.pause .rdot{background:var(--warnInk);animation:none;box-shadow:0 0 0 4px var(--warnLine)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.recbar b{font-family:Poppins,sans-serif;font-size:14px;font-weight:600}
.recbar .t{font-family:Poppins,sans-serif;font-size:15px;font-weight:700;color:var(--dangerInk);
  font-variant-numeric:tabular-nums}
.recbar.pause .t{color:var(--warnInk)}
.recbar .s{font-size:12.5px;color:var(--sec);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.recbar .a{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:20px 0 18px;flex:0 0 auto}
.tabs a{display:flex;align-items:center;gap:8px;padding-bottom:11px;font-family:Poppins,sans-serif;
  font-size:14px;font-weight:600;color:var(--sec);border-bottom:2px solid transparent;
  margin-bottom:-1px;cursor:pointer}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--brandInk);border-bottom-color:var(--brand)}
.tabs a.off{color:var(--ter);cursor:not-allowed}
.tabs a.off:hover{color:var(--ter)}
.tabs a .cnt{font-size:11.5px;font-weight:700;background:var(--tint);color:var(--brandInk);
  border-radius:9px;padding:1px 7px}
.tabs a.off .cnt{background:var(--sunk);color:var(--ter)}
.sec{margin-bottom:18px}
.sec h3{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.sec h3 .ic{color:var(--brandInk)}
.sec p{font-size:13.5px;line-height:1.65;color:var(--ink2)}
.bul{list-style:none;display:flex;flex-direction:column;gap:9px}
.bul li{display:flex;gap:10px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.bul li .dot{width:5px;height:5px;border-radius:50%;background:var(--brand);flex:0 0 auto;margin-top:8px}
.jump{font-size:12px;color:var(--brandInk);white-space:nowrap;margin-left:auto;flex:0 0 auto;
  font-family:Poppins,sans-serif;font-weight:600;cursor:pointer}
.jump:hover{text-decoration:underline}
.notebox{border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:150px}
.notebox:focus-within{border-color:var(--brand)}
.notebox .ln{font-size:13.5px;line-height:1.8;color:var(--ink2);outline:0;min-height:80px}
.notebox .hint{font-size:12.5px;color:var(--ter)}
.trs{display:flex;gap:14px;padding:12px 14px;border-radius:10px}
.trs.hl{background:var(--tint2);border:1px solid var(--tint)}
.trs .tm{font-size:12px;color:var(--sec);font-variant-numeric:tabular-nums;width:44px;
  flex:0 0 auto;padding-top:2px;cursor:pointer}
.trs .tm:hover{color:var(--brandInk)}
.trs .spk{font-family:Poppins,sans-serif;font-size:13px;font-weight:600;display:block;margin-bottom:3px}
.trs .tx{font-size:13.5px;line-height:1.6;color:var(--ink2)}
.trs .tx mark{background:var(--tint);color:var(--brandInk);border-radius:3px}
/* self-contained, but listed per host to match how .live is handled above */
.trs .badge,.dchips .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  color:var(--brandInk);background:var(--tint);border-radius:14px;padding:2px 9px;margin-top:7px;
  font-family:Poppins,sans-serif}
.player{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;margin-top:16px;flex:0 0 auto}
.player .pb{width:36px;height:36px;border-radius:50%;background:var(--brandFill);color:var(--brandOn);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
.player .tm{font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums;flex:0 0 auto}
.scrub{flex:1;height:26px;display:flex;align-items:center;gap:2px;cursor:pointer}
.scrub i{width:3px;border-radius:2px;background:var(--meterOff)}
.scrub i.p{background:var(--brand)}

/* ══════════════════════════════ speech ══════════════════════════════ */
.holdbtn{display:flex;align-items:center;gap:10px;background:var(--brandFill);color:var(--brandOn);
  border-radius:12px;padding:12px 18px;font-family:Poppins,sans-serif;font-size:14px;
  font-weight:600;flex:0 0 auto;cursor:pointer;user-select:none}
.holdbtn:hover{filter:brightness(1.08)}
.holdbtn.live{background:var(--danger);color:var(--dangerOn);filter:none}
.holdbtn .kb{font-size:12px;font-weight:700;background:var(--onChip);border-radius:6px;
  padding:2px 7px;color:var(--brandOn)}
.statusline{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.statusline .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sub{font-size:12.5px;color:var(--sec);margin-top:5px}
.trow{display:flex;align-items:flex-start;gap:12px;padding:13px 14px}
.trow+.trow{border-top:1px solid var(--line)}
.trow:hover{background:var(--sunk)}
.trow .tx{font-size:13.5px;color:var(--ink);line-height:1.45;display:block;outline:0}
.trow .tm{font-size:12px;color:var(--sec);margin-top:4px;display:block}
.acts{margin-left:auto;display:flex;gap:4px;flex:0 0 auto;opacity:0;pointer-events:none}
.trow:hover .acts{opacity:1;pointer-events:auto}
.acts span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--sec);background:var(--surf);border:1px solid var(--line2);cursor:pointer}
.acts span:hover{border-color:var(--brand);color:var(--brandInk)}
.acts span.dg:hover{border-color:var(--danger);color:var(--dangerInk)}
.metrics{display:flex;align-items:center;gap:22px;font-size:13px;color:var(--sec);
  margin-top:16px;padding:0 2px;flex-wrap:wrap}
.metrics b{color:var(--ink);font-family:Poppins,sans-serif;font-weight:600}
.metrics .sp{width:1px;height:14px;background:var(--line2)}

/* ══════════════════════════════ tasks ══════════════════════════════ */
.toolrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;flex:0 0 auto}
.toolrow .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer}
.addrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line2);background:var(--surf);
  border-radius:11px;padding:12px 14px;margin-bottom:18px;color:var(--sec);flex:0 0 auto}
.addrow:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.addrow input{font-size:13.5px;width:100%}
.addrow input::placeholder{color:var(--ter)}
.trk{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;cursor:pointer}
.trk+.trk{border-top:1px solid var(--line)}
.trk:hover{background:var(--sunk)}
.trk.sel{background:var(--tint2)}
.trk .t{font-size:13.5px;color:var(--ink);line-height:1.4;display:block}
.trk.done .t{text-decoration:line-through;color:var(--sec)}
.trk .m{font-size:12px;color:var(--sec);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.trk .due{margin-left:auto;font-size:12.5px;color:var(--sec);flex:0 0 auto;white-space:nowrap}
.trk .due.dg{color:var(--dangerInk);font-weight:700}
.trk .kb2{opacity:0;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;color:var(--sec);flex:0 0 auto;pointer-events:none}
.trk:hover .kb2{opacity:1;pointer-events:auto}
.trk .kb2:hover{background:var(--line)}

/* ══════════════════════════════ assistant ══════════════════════════════ */
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;max-width:620px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surf);
  border-radius:22px;padding:9px 16px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brandInk)}
.chip.off{background:var(--sunk);border-style:dashed;color:var(--ter);cursor:not-allowed}
.chip.off:hover{border-color:var(--line2);color:var(--ter)}
.scope{font-size:12.5px;color:var(--sec);margin-top:16px}
.comp{margin-top:auto;padding-top:14px;flex:0 0 auto}
.compbox{display:flex;align-items:center;gap:11px;border:1px solid var(--line2);background:var(--surf);
  border-radius:13px;padding:12px 14px}
.compbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.compbox.off{background:var(--sunk);border-color:var(--line)}
.compbox input{flex:1;font-size:13.5px}
.compbox input::placeholder{color:var(--ter)}
.compbox .ic{color:var(--sec)}
.compbox.off .ic{color:var(--ter);opacity:.6}
.sendb{width:34px;height:34px;border-radius:10px;background:var(--brandFill);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;
  box-shadow:0 1px 2px rgba(48,24,10,.14)}
.compbox .sendb .ic,.sendb .ic{color:var(--brandOn);opacity:1}
.sendb:hover{background:var(--brandFillHov)}
.sendb.off{background:var(--sunk);box-shadow:none;cursor:not-allowed}
.compbox .sendb.off .ic{color:var(--ter)}
.msg{display:flex;gap:10px;margin-bottom:18px;align-items:flex-end}
/* row-reverse makes flex-start the right edge, so the user's turn packs right
   with its avatar outermost — no margin-left:auto needed */
.msg.u{flex-direction:row-reverse}
.msg .who{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-family:Poppins,sans-serif;font-size:12px;font-weight:600}
.msg.u .who{background:var(--tint);color:var(--brandInk)}
.msg.a .who{background:var(--ink);color:var(--surf)}
.msg .tx{font-size:13.5px;line-height:1.6;color:var(--ink2);padding:10px 14px;border-radius:15px;
  max-width:min(76%,620px)}
.msg.a .tx{background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.u .tx{background:var(--tint);color:var(--ink);border:1px solid transparent;
  border-bottom-right-radius:5px}
.msg .tx b{color:var(--ink)}
.msg.a .tx.typing{padding:13px 16px}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;
  color:var(--brandInk);background:var(--tint2);border:1px solid var(--tint);border-radius:16px;
  padding:4px 11px;cursor:pointer}
.src:hover{background:var(--tint)}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sec);
  margin-right:4px;animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ══════════════════════════════ modal / menu / toast ══════════════════════════════ */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.modal{position:absolute;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--surf);border-radius:18px;box-shadow:var(--shadow);
  max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:hidden;display:flex}
.mnav{width:236px;flex:0 0 auto;background:var(--rail);border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.mnav h3{font-family:Poppins,sans-serif;font-size:16px;font-weight:600;padding:2px 10px 14px}
.mnav .gl{font-family:Poppins,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ter);padding:14px 10px 6px}
.mnav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
  color:var(--ink2);font-size:13px;cursor:pointer}
.mnav a:hover{background:var(--sunk)}
.mnav a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.mnav a .ic{color:var(--sec)}
.mnav a.on .ic{color:var(--brandInk)}
.mbody{flex:1;display:flex;flex-direction:column;min-width:0}
.mtop{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.mtop h2{font-family:Poppins,sans-serif;font-size:17px;font-weight:600}
.mtop p{font-size:12.5px;color:var(--sec);margin-top:3px}
.mtop .x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--sec);flex:0 0 auto;cursor:pointer}
.mtop .x:hover{background:var(--sunk)}
.mcont{flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sgroup{border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:0 0 auto}
.sghd{display:flex;align-items:center;gap:11px;padding:13px 16px;background:var(--sunk);
  border-bottom:1px solid var(--line)}
.sghd .si{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;background:var(--tint);color:var(--brandInk)}
.sghd b{font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;display:block}
.sghd span{font-size:12px;color:var(--sec);display:block;margin-top:1px}
.srow{display:flex;align-items:center;gap:14px;padding:13px 16px}
.srow+.srow{border-top:1px solid var(--line)}
.srow .t{font-size:13.5px;font-weight:600;display:block;font-family:Poppins,sans-serif}
.srow .s{font-size:12px;color:var(--sec);display:block;margin-top:3px;line-height:1.45;max-width:600px}
.srow .a{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:9px}
.menu{position:absolute;z-index:22;background:var(--surf);border:1px solid var(--line2);
  border-radius:12px;box-shadow:var(--shadow2);padding:6px;min-width:214px;
  max-width:calc(100% - 24px);max-height:calc(100% - 96px);overflow-y:auto}
.menu a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:13px;
  color:var(--ink2);cursor:pointer}
.menu a:hover{background:var(--sunk)}
.menu a .ic{color:var(--sec)}
.menu a.dg{color:var(--dangerInk)}
.menu a.dg .ic{color:var(--dangerInk)}
.menu a .k{margin-left:auto;font-size:11.5px;color:var(--sec)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.menu .mh{font-size:11px;font-family:Poppins,sans-serif;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ter);padding:8px 10px 4px}
.menu .fn{font-size:11.5px;color:var(--sec);padding:2px 10px 8px;line-height:1.45}
.panel{width:400px;flex:0 0 400px;border-left:1px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column}
.panel .ph{display:flex;align-items:center;gap:10px;height:64px;padding:0 20px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.panel .ph b{font-family:Poppins,sans-serif;font-size:14px;font-weight:600}
.panel .pb2{padding:20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.frow{display:flex;align-items:center;gap:12px;font-size:13px}
.frow .lb{width:88px;flex:0 0 auto;color:var(--sec)}
.quote{border-left:3px solid var(--tint);padding:2px 0 2px 14px;font-size:13px;line-height:1.6;
  color:var(--ink2);font-style:italic}
#toasts{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surf);font-size:13px;padding:10px 16px;border-radius:10px;
  box-shadow:var(--shadow2);animation:tin .22s;max-width:520px;text-align:center}
.toast b{font-family:Poppins,sans-serif;font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ══════════════════════════════ vocab / insights ══════════════════════════════ */
.vtable{width:100%;border-collapse:collapse}
.vtable th{text-align:left;font-family:Poppins,sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--sec);padding:11px 16px;
  border-bottom:1px solid var(--line)}
.vtable td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.vtable tr:last-child td{border-bottom:0}
.vtable tr:hover td{background:var(--sunk)}
.vtable td.tm{font-family:Poppins,sans-serif;font-weight:600;color:var(--ink)}
.pillx{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:6px;padding:2px 8px;font-family:Poppins,sans-serif;background:var(--sunk);color:var(--sec)}
.pillx.ai{background:var(--tint);color:var(--brandInk)}
.stat{border:1px solid var(--line);border-radius:14px;padding:18px;flex:1;min-width:0}
.stat .lb{font-size:12.5px;color:var(--sec)}
.stat .big{font-family:Poppins,sans-serif;font-size:30px;font-weight:600;letter-spacing:-.02em;
  margin-top:8px;line-height:1}
.stat .dl{font-size:12px;color:var(--sec);margin-top:8px;display:flex;align-items:center;gap:6px}
.chart{display:flex;align-items:flex-end;gap:14px;height:148px;position:relative;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  height:100%;position:relative;cursor:default}
.chart .bar{width:100%;max-width:34px;background:var(--brand);border-radius:4px 4px 0 0;transition:height .3s}
.chart .bar.mute{background:var(--o200)}
.chart .col:hover .ttip{opacity:1}
.gridl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--sec)}
.gridl span{position:absolute;left:-34px;top:-8px}
.xax{display:flex;gap:14px;margin-top:9px;border-top:1px solid var(--line2);padding-top:9px}
.xax span{flex:1;text-align:center;font-size:11.5px;color:var(--sec)}
.hbar{display:flex;align-items:center;gap:12px;padding:7px 0}
.hbar .lb{width:112px;flex:0 0 auto;font-size:13px;color:var(--ink2)}
.hbar .tr{flex:1;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:14px;background:var(--brand);border-radius:4px;transition:width .3s}
.hbar .vv{width:38px;text-align:right;font-size:12.5px;color:var(--sec);flex:0 0 auto}
.ttip{position:absolute;background:var(--ink);color:var(--surf);font-size:11.5px;padding:6px 9px;
  border-radius:7px;white-space:nowrap;z-index:3;opacity:0;transition:opacity .12s;pointer-events:none}
.ttip b{display:block;font-size:12.5px;font-family:Poppins,sans-serif;font-weight:600}
.opt{display:flex;gap:13px;border:1px solid var(--line2);border-radius:12px;padding:14px 16px;
  flex:1;cursor:pointer}
.opt.on{border-color:var(--brand);background:var(--tint2)}
.opt .t{font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;display:block}
.opt .s{font-size:12.5px;color:var(--sec);display:block;margin-top:5px;line-height:1.5}
.opt ul{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt li{display:flex;gap:7px;font-size:12px;color:var(--ink2);align-items:flex-start;line-height:1.4}
.step{display:flex;gap:13px;padding:14px 16px}
.step+.step{border-top:1px solid var(--line)}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--brandInk);
  font-family:Poppins,sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;margin-top:1px}
.step .num.done{background:var(--ok);color:#FFFFFF}
.step .num.wait{background:var(--sunk);color:var(--ter)}
.step .t{font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;display:block}
.step .s{font-size:12.5px;color:var(--sec);display:block;margin-top:4px;line-height:1.5;max-width:640px}
.step .a{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:9px}
.keycap{font-family:Poppins,sans-serif;font-size:13px;font-weight:700;background:var(--sunk);
  border:1px solid var(--line2);border-bottom-width:2px;border-radius:7px;padding:5px 11px;color:var(--ink)}
.tips{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
.tips div{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.hint{font-size:12.5px;color:var(--ter)}
.dim{color:var(--sec)}
/* ══════════════════════════════ responsive ══════════════════════════════
   Widths are driven from JS (frame width, not viewport, because the mock
   window can be smaller than the browser). w3 → tight, w2 → single column,
   w1 → phone-ish. Sidebars are auto-collapsed by fit() at the same points. */
.notesgrid{flex:1;display:grid;grid-template-columns:1.32fr 1fr;gap:30px;overflow-y:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.wrapflex{display:flex;gap:14px;flex-wrap:wrap}
#frame.w3 .body{padding:20px}
#frame.w3 .notesgrid{gap:22px}
#frame.w3 .panel{width:340px;flex-basis:340px}
#frame.w3 .tabs{gap:18px}
#frame.w2 .body{padding:16px}
#frame.w2 .notesgrid,#frame.w2 .g2{grid-template-columns:1fr;gap:18px}
#frame.w2 .topbar{gap:10px;padding:0 12px 0 16px}
#frame.w2 .topbar .state{display:none}
#frame.w2 .topbar h1{font-size:19px}
#frame.w2 .mnav{width:60px;flex-basis:60px;padding:14px 8px;align-items:center}
#frame.w2 .mnav h3,#frame.w2 .mnav .gl,#frame.w2 .mnav .lbl{display:none}
#frame.w2 .mnav a{justify-content:center;width:40px;height:40px;padding:0}
#frame.w1 .mnav{display:none}
#frame.w2 .chart{height:120px}
#frame.w2 .stat .big{font-size:24px}
#frame.w2 .metrics{gap:14px}
#frame.w2 .panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,88%);flex-basis:auto;
  z-index:15;box-shadow:var(--shadow2)}
#frame.w1 .body{padding:12px}
#frame.w1 .topbar h1{font-size:17px}
#frame.w1 .tabs{gap:14px}
#frame.w1 .tabs a{font-size:13px}
#frame.w1 .empty p,#frame.w1 .setuprow .s{max-width:none}
#frame.w1 .setuprow,#frame.w1 .step,#frame.w1 .srow{flex-wrap:wrap}
#frame.w1 .setuprow .a,#frame.w1 .step .a,#frame.w1 .srow .a{margin-left:0;padding-left:47px}
#frame.w1 .mrow{flex-wrap:wrap;gap:8px}
#frame.w1 .mrow .rt{text-align:left;min-width:0}
#frame.w1 .recbar{flex-wrap:wrap}
#frame.w1 .recbar .a{margin-left:0;width:100%}
#frame.w1 .modal{border-radius:14px}

/* ══════════════════════════════ folder tree ══════════════════════════════ */
/* One level of nesting only: a top folder may hold sub-folders, a sub-folder
   may not. The twisty is its own hit target inside the row so clicking it
   expands without also navigating. */
.views a .tw{width:16px;height:16px;margin-right:-4px;display:flex;align-items:center;
  justify-content:center;color:var(--ter);flex:0 0 auto;border-radius:4px;cursor:pointer}
.views a .tw svg{transition:transform .14s}
.views a .tw.o svg{transform:rotate(90deg)}
.views a .tw:hover{background:var(--line);color:var(--ink2)}
.views a .tw.sp{pointer-events:none}
.views a.sub{padding-left:32px;font-size:13px}
.views a.sub:before{content:'';position:absolute;left:19px;top:0;bottom:0;width:1px;background:var(--line2)}
.views a.sub{position:relative}
.views a .fm{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;color:var(--ter);flex:0 0 auto;opacity:0;pointer-events:none;margin-left:auto}
.views a:hover .fm{opacity:1;pointer-events:auto}
.views a .fm:hover{background:var(--line);color:var(--ink2)}
.views a .fm+.n{margin-left:6px}
.app.listmin .views a .tw,.app.listmin .views a .fm{display:none}
.app.listmin .views a.sub{padding-left:0}
.app.listmin .views a.sub:before{display:none}

/* ══════════════════════════════ theme picker ══════════════════════════════ */
/* Swatches are literal hex, not tokens — each card has to show its own palette
   while a different theme is the one actually applied. */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:12px;padding:16px}
.thcard{border:1.5px solid var(--line2);border-radius:13px;padding:12px;cursor:pointer;
  background:var(--surf);display:flex;flex-direction:column;gap:10px;position:relative;
  transition:border-color .14s,box-shadow .14s}
.thcard:hover{border-color:var(--o300)}
.thcard.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.thcard .prev{height:52px;border-radius:9px;overflow:hidden;display:flex;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
.thcard .prev i{flex:1}
.thcard .prev i.a{flex:0 0 22%}
.thcard .prev i.b{flex:0 0 14%}
.thcard .nm{font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;display:flex;
  align-items:center;gap:7px}
.thcard .nm .tick{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--brand);
  color:var(--brandOn);display:none;align-items:center;justify-content:center;flex:0 0 auto}
.thcard.on .nm .tick{display:flex}
.thcard .ds{font-size:11.5px;color:var(--sec);line-height:1.4}
.thcard .dots{display:flex;gap:5px}
.thcard .dots i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.38)}
.thcard .modes{display:flex;gap:5px;margin-left:auto;font-size:10.5px;color:var(--ter);
  font-family:Poppins,sans-serif;font-weight:600;letter-spacing:.04em}

/* ══════════════════════════════ toast variants ══════════════════════════════ */
.toast{display:flex;align-items:center;justify-content:center;gap:9px}
.toast.ok,.toast.warn,.toast.dg,.toast.info{text-align:left;justify-content:flex-start}
.toast .ic{flex:0 0 auto}
.toast.ok{background:var(--okInk);color:#FFF}
.toast.warn{background:var(--warnInk);color:#FFF}
.toast.dg{background:var(--dangerInk);color:#FFF}
.toast.info{background:var(--info);color:#FFF}
[data-theme="dark"] .toast.ok,[data-theme="dark"] .toast.warn,
[data-theme="dark"] .toast.dg,[data-theme="dark"] .toast.info{color:#0B0B0B}
.notice.info{background:var(--infoTint);border:1px solid var(--infoLine);color:var(--ink2)}
.notice.info .ic{color:var(--info)}

/* ══════════════════════════════ system notifications ══════════════════════════════ */
/* The macOS-style banner AIT-Scribe posts outside the app window. Stacked top
   right of the frame so the demo page can show them without leaving Settings. */
#osnotifs{position:absolute;right:18px;top:78px;z-index:41;display:flex;flex-direction:column;
  gap:10px;align-items:flex-end;width:344px}
.osn{width:100%;background:var(--surf);border:1px solid var(--line2);border-radius:15px;
  box-shadow:var(--shadow);padding:13px 14px;display:flex;gap:11px;animation:osin .26s cubic-bezier(.2,.9,.3,1)}
.osn .ai{width:34px;height:34px;border-radius:9px;background:var(--brandFill);color:var(--brandOn);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.osn.dg .ai{background:var(--danger);color:var(--dangerOn)}
.osn.ok .ai{background:var(--ok);color:#FFF}
.osn .bd{flex:1;min-width:0}
.osn .ap{font-size:10.5px;font-family:Poppins,sans-serif;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ter);display:flex;align-items:center;gap:6px}
.osn .ap .w{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.osn .ti{display:block;font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.35}
.osn .bo{display:block;font-size:12.5px;color:var(--sec);line-height:1.45;margin-top:3px}
.osn .ac{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.osn .x{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--ter);flex:0 0 auto;cursor:pointer}
.osn .x:hover{background:var(--sunk);color:var(--ink2)}
@keyframes osin{from{opacity:0;transform:translateX(22px)}}

/* ══════════════════════════════ floating bubble ══════════════════════════════ */
/* Lives in the frame, not in #app, so a re-render never interrupts a drag or a
   hover. z-index sits below .scrim (20) on purpose: an open modal covers it.

   #bubble is exactly the size of its core. The hover tray and the label are
   absolutely positioned off it so they cost no layout — otherwise the hidden
   tray would push the core out through the bottom of the window. The tray's
   10px offset is its own padding rather than a gap, so travelling from the core
   to a tray button never leaves #bubble and never drops the :hover. */
#bubble{position:absolute;z-index:18;width:60px;height:60px;user-select:none}
#bubble.off{display:none}
#bubble.drag .bcore{cursor:grabbing;transform:scale(1.05)}
.btray{position:absolute;left:0;bottom:100%;width:60px;padding-bottom:10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;transform:translateY(10px) scale(.9);transform-origin:50% 100%;pointer-events:none;
  transition:opacity .16s,transform .18s cubic-bezier(.2,.9,.3,1)}
/* near the top of the window the tray drops below the core instead */
#bubble.flip .btray{bottom:auto;top:100%;padding-bottom:0;padding-top:10px;
  flex-direction:column-reverse;transform-origin:50% 0;transform:translateY(-10px) scale(.9)}
#bubble:hover .btray,#bubble.open .btray{opacity:1;transform:none;pointer-events:auto}
.btray span{width:40px;height:40px;border-radius:50%;background:var(--surf);
  border:1px solid var(--line2);box-shadow:var(--shadow2);display:flex;align-items:center;
  justify-content:center;color:var(--ink2);cursor:pointer;position:relative;flex:0 0 auto;
  transition:transform .12s,border-color .12s,color .12s}
.btray span:hover{border-color:var(--brand);color:var(--brandInk);transform:translateY(-1px)}
.btray span .tip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:var(--ink);color:var(--surf);font-size:11.5px;padding:4px 9px;border-radius:7px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .13s;
  font-family:Poppins,sans-serif;font-weight:500}
.btray span:hover .tip{opacity:1}
.bcore{width:60px;height:60px;border-radius:50%;background:var(--brandFill);color:var(--brandOn);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 10px 26px rgba(0,0,0,.26),0 0 0 1px rgba(0,0,0,.06);cursor:grab;
  transition:background .16s,transform .12s}
.bcore:hover{background:var(--brandFillHov)}
#bubble.rec .bcore{background:var(--danger);color:var(--dangerOn);
  animation:bpulse 1.6s ease-in-out infinite}
#bubble.rec .bcore:hover{background:var(--danger)}
.bcore .tm{font-size:10px;font-weight:700;font-family:Poppins,sans-serif;letter-spacing:.02em}
.bmeter{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:9px;margin-top:1px}
.bmeter i{width:2px;border-radius:1px;background:currentColor;opacity:.8}
.blabel{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);
  font-size:11px;font-family:Poppins,sans-serif;font-weight:600;color:var(--surf);
  background:var(--ink);padding:3px 9px;border-radius:7px;white-space:nowrap;
  opacity:0;transition:opacity .15s;pointer-events:none}
#bubble.flip .blabel{top:auto;bottom:calc(100% + 7px)}
#bubble:hover .blabel,#bubble.rec .blabel{opacity:1}
@keyframes bpulse{0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.26),0 0 0 0 var(--ring)}
  50%{box-shadow:0 10px 26px rgba(0,0,0,.26),0 0 0 9px var(--ring)}}

/* ══════════════════════════════ demo page ══════════════════════════════ */
.dwrap{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.dnote{font-size:11.5px;color:var(--ter);line-height:1.45}
.dgrid{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* rows of sample chips; opts the row into the host-scoped .live / .badge rules */
.dchips{}

/* ══════════════════════════════ folder detail ══════════════════════════════ */
/* A top-level folder shows its sub-folders as cards and then its own meetings;
   a sub-folder shows the rolled-up notes instead, since it has no children. */
.fhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.fhead .fi{width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fhead .ft{min-width:0;flex:1}
.fhead h1{font-family:Poppins,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.015em;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fhead h1 .edit{opacity:0;color:var(--sec);display:inline-flex;pointer-events:none}
.fhead:hover h1 .edit{opacity:1}
.fhead .fs{font-size:13px;color:var(--sec);margin-top:5px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap}
.fhead .fa{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;margin-bottom:24px}
.fcard{border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;background:var(--surf);
  display:flex;flex-direction:column;gap:10px;transition:border-color .14s,box-shadow .14s}
.fcard:hover{border-color:var(--brand);box-shadow:var(--shadow2)}
.fcard .top{display:flex;align-items:center;gap:10px}
.fcard .top .fi{width:32px;height:32px;border-radius:10px;background:var(--tint2);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fcard .nm{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fm{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;color:var(--ter);flex:0 0 auto;opacity:0;pointer-events:none}
.fcard:hover .fm{opacity:1;pointer-events:auto}
.fcard .fm:hover{background:var(--sunk);color:var(--ink2)}
.fcard .ds{font-size:12.5px;color:var(--sec);line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .mt{font-size:12px;color:var(--ter);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:auto}
.fcard .mt b{color:var(--ink2);font-family:Poppins,sans-serif;font-weight:600}
.fcard.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;
  color:var(--sec);min-height:118px}
.fcard.add:hover{color:var(--brandInk)}
.fcard.add .nm{font-size:13px;white-space:normal;text-align:center;flex:0 0 auto}
/* the rolled-up notes on a sub-folder page reuse the meeting note sections but
   need a source chip per line, since each line came from a different call */
.rollgrid{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
.bul li .from{font-size:11.5px;color:var(--ter);white-space:nowrap;margin-left:auto;flex:0 0 auto;
  cursor:pointer;font-family:Poppins,sans-serif;font-weight:600}
.bul li .from:hover{color:var(--brandInk);text-decoration:underline}
#frame.w2 .rollgrid{grid-template-columns:1fr}

/* ══════════════════════════════ attendees ══════════════════════════════ */
.attx{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  font-family:Poppins,sans-serif;font-weight:600;cursor:pointer;border-radius:7px;padding:3px 7px;
  margin-left:2px}
.attx:hover{background:var(--sunk);color:var(--brandInk)}
.faces i.more{background:var(--sunk)!important;color:var(--sec);font-size:10px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.prow:hover{background:var(--sunk)}
.prow .av{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:10.5px;font-weight:700;color:#FFF;font-family:Poppins,sans-serif}
.prow .nm{flex:1;min-width:0;font-size:13px;color:var(--ink2)}
.prow .nm span{display:block;font-size:11px;color:var(--ter);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.prow .rm{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;color:var(--ter);flex:0 0 auto;cursor:pointer;opacity:.45;
  transition:opacity .12s}
.prow:hover .rm{opacity:1}
.prow .rm:hover{background:var(--dangerTint);color:var(--dangerInk)}
.prow .me{font-size:11px;color:var(--ter);font-family:Poppins,sans-serif;font-weight:600;flex:0 0 auto}

/* ══════════════════════════════ meeting assistant panel ══════════════════════════════ */
/* Shares .panel with the task details panel, so only the chat body differs. */
.app.mchat .notesgrid,.app.mchat .rollgrid{grid-template-columns:1fr;gap:18px}
.app.mchat .notesgrid{overflow-y:auto}
.panel.chat .pb2{padding:18px 18px 0;gap:0;flex:1}
.panel .cfoot{padding:0 18px 16px;flex:0 0 auto}
.panel .cfoot .comp{margin-top:0;padding-top:10px}
.panel .cfoot .compbox{padding:9px 11px;border-radius:11px}
.panel .cfoot .compbox input{font-size:13px}
.panel.chat .msg{margin-bottom:15px}
.panel.chat .msg .tx{max-width:82%;font-size:13px}
.panel.chat .msg .who{width:26px;height:26px;border-radius:8px}
.cempty{font-size:13px;color:var(--sec);line-height:1.6}
.cchips{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cchips span{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:12.5px;
  color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:9px;background:var(--surf)}
.cchips span:hover{border-color:var(--brand);color:var(--brandInk)}
.cchips span .ic{color:var(--sec);flex:0 0 auto}
.cchips span:hover .ic{color:var(--brandInk)}
.hidden{display:none!important}
</style>

function osNotif(kind){
  const n=OSN[kind];if(!n)return;
  const w=$('#osnotifs');const d=document.createElement('div');
  d.className='osn '+(n.k||'');
  d.innerHTML=`<span class="ai">${ic(n.ic,17)}</span>
    <span class="bd"><span class="ap">AIT-Scribe<span class="w">now</span></span>
      <span class="ti">${n.ti}</span><span class="bo">${n.bo}</span>
      <span class="ac">${n.ac.map(([l,st,a,pp])=>
        `<button class="btn ${st} sm" data-a="${a}" data-p="${esc(pp)}">${l}</button>`).join('')}</span></span>
    <span class="x" data-a="osnclose">${ic('x',14)}</span>`;
  /* any button in the banner also closes it, whatever else it does */
  d.addEventListener('click',()=>setTimeout(()=>d.remove(),40));
  w.appendChild(d);
  /* keep the pile to four so a burst cannot run off the bottom of the window */
  while(w.children.length>4)w.firstChild.remove();
  setTimeout(()=>{if(!d.parentNode)return;d.style.transition='opacity .3s';d.style.opacity='0';
    setTimeout(()=>d.remove(),320)},7000);
}

const rootOf=id=>{const f=folder(id);return f&&f.parent?f.parent:id;};

const folderPath=id=>{const f=folder(id);if(!f)return 'Unfiled';
  return f.parent?folderName(f.parent)+' / '+f.name:f.name;};
const inFolder=(m,id)=>m.folder===id||subFolders(id).some(sf=>sf.id===m.folder);
const folderCount=id=>db.meetings.filter(m=>inFolder(m,id)).length;
/* colour is inherited from the top-level folder so a sub-folder reads as part
   of its parent rather than as a new category */
const folderColor=id=>({client:'var(--brandInk)',internal:'var(--okInk)',
  interviews:'var(--info)',projects:'var(--warnInk)'}[rootOf(id)]||'var(--sec)');
const newFolderId=()=>'f'+Math.random().toString(36).slice(2,8);
/* A sub-folder control is named after the folder it will sit in — "Add Client
   Calls Folder" — so the destination is unambiguous wherever the button appears.
   Passing no id gives the top-level wording. */
const addFolderLabel=id=>id?`Add ${folderName(id)} Folder`:'Add Folder';
const folderMeetings=id=>db.meetings.filter(m=>inFolder(m,id));
/* Decisions and open questions are rolled up from the member meetings, each line
   keeping a link back to the call it was said on. */
const folderLines=(id,key)=>folderMeetings(id).flatMap(m=>
  (m.notes&&m.notes[key]||[]).map(d=>({tx:d[0],at:d[1],mid:m.id,mt:m.title})));
const folderTasks=id=>{const ids=folderMeetings(id).map(m=>m.id);
  return db.tasks.filter(t=>ids.includes(t.mid)&&!t.done);};
/* Seeded sub-folders carry a written summary; anything the user creates gets a
   derived one so the page never looks broken. */
function folderSummary(id){
  const f=folder(id);
  if(f&&f.sum)return f.sum;
  const ms=folderMeetings(id),n=ms.length;
  if(!n)return id===''?'Nothing is waiting to be filed — every meeting has a folder.'
    :'Nothing has been filed here yet. Move a meeting in and AIT-Scribe will roll its notes up on this page.';
  const who=[...new Set(ms.flatMap(m=>m.people.map(x=>x.n)).filter(x=>x!=='you'))];
  return `${n} meeting${n>1?'s':''} filed here, with ${who.slice(0,3).join(', ')}${
    who.length>3?` and ${who.length-3} other${who.length-3>1?'s':''}`:''}. `+
    `A written summary appears once AIT-Scribe has read across all of them.`;
}
const openTasks=()=>db.tasks.filter(t=>!t.done);
const taskCount=id=>db.tasks.filter(t=>t.mid===id).length;
const overdue=()=>db.tasks.filter(t=>!t.done&&t.late);

const NAV=[['meetings','Meetings','people'],['speech','Speech to Text','wave2'],
           ['tasks','Tasks','clipb'],['assistant','AI Assistant','spark']];
const isSpeech=r=>['speech','vocabulary','insights'].includes(r);

function rail(){

    const on=(k===S.route)||(k==='speech'&&isSpeech(S.route));
    let h=`<a class="${on?'on':''}" data-a="go" data-p="${k}" title="${label}">${
      ic(icon,18)}<span class="lbl">${label}</span></a>`;
    if(k==='speech'&&isSpeech(S.route)&&!S.railmin)
      h+=`<div class="subnav">
        <a class="${S.route==='vocabulary'?'on':''}" data-a="go" data-p="vocabulary">${ic('book',14,1.8)}Vocabulary</a>
        <a class="${S.route==='insights'?'on':''}" data-a="go" data-p="insights">${ic('chart',14,1.8)}Insights</a></div>`;
    return h;}).join('');
  return `<div class="rail">
    <div class="slab">Workspace</div>
    <div class="nav">${items}</div><div class="spacer"></div>
    <div class="colbtn" data-a="railmin" title="${S.railmin?'Expand':'Collapse'} sidebar">${
      ic(S.railmin?'panelR':'panelL',17)}<b>Collapse</b></div>

      <button class="upg" data-a="demo" data-p="open the upgrade flow">Upgrade</button></span></div></div>`;
}
function tools(extra=''){

  return `${extra}<span class="tbtn" data-a="settings" data-p="appearance" title="Settings">${ic('sliders',18)}</span>
    <span class="tbtn" data-a="shortcuts" title="Keyboard shortcuts">${ic('help',18)}</span>
    <span class="tbtn ${n?'hasbadge':''}" data-a="notifs" title="Notifications">${ic('bell',18)}</span>`;
}
/* Each route still declares its own title / state / actions through mhead(),
   but the chrome is now one window-wide title bar above both sidebars, so the
   call just parks the values and topbar() renders them. */
let TOP={title:'',state:'',actions:'',crumb:null};
function mhead(title,state,actions='',crumb=null){TOP={title,state,actions,crumb};return '';}
function topbar(){
  const t=TOP;
  const head=t.crumb?`<div class="crumb">${t.crumb}</div>`
    :`<div class="ttl"><h1 class="h">${t.title}</h1>${t.state?`<span class="state">${t.state}</span>`:''}</div>`;
  return `<div class="topbar">
    <span class="lights">
      <i class="r" data-a="win" data-p="close" title="Close">${ic('x',8,3)}</i>
      <i class="y" data-a="win" data-p="min" title="Minimize">${ic('minus',8,3)}</i>
      <i class="g" data-a="win" data-p="zoom" title="Fill the screen">${ic('expand',8,3)}</i></span>
    ${head}<span class="r">${tools()}${t.actions}</span></div>`;
}
/* the collapse control that sits at the foot of the list column */
function lfoot(){
  return `<div class="lfoot"><div class="colbtn" data-a="listmin" title="${
    S.listmin?'Expand':'Collapse'} list">${ic(S.listmin?'panelR':'panelL',17)}<b>Collapse</b></div></div>`;
}
const v=(on,icon,label,right,act,par)=>`<a class="${on?'on':''}" data-a="${act}" data-p="${par}" title="${
  esc(label)}">${ic(icon,16)}<span class="lbl">${label}</span>${right||''}</a>`;
const cnt=n=>`<span class="n">${n}</span>`;
const pill=n=>`<span class="pill">${n}</span>`;

/* ══════════════════════════════════ list columns ══════════════════════════════════ */
/* A folder row and, when expanded, its sub-folder rows beneath it. The twisty
   and the ⋯ button are nested hit targets: the click handler walks up from the
   event target with closest('[data-a]'), so the innermost one wins and the row
   itself only navigates when neither was hit. */
function folderRow(f,sub){
  const kids=sub?[]:subFolders(f.id);
  const open=!!S.openF[f.id];
  const tw=kids.length
    ? `<span class="tw ${open?'o':''}" data-a="foldtoggle" data-p="${f.id}"
        title="${open?'Collapse':'Expand'}">${ic('chev',11,2.4)}</span>`
    : (sub?'':`<span class="tw sp"></span>`);
  return `<a class="${S.view==='f:'+f.id?'on':''}${sub?' sub':''}" data-a="view" data-p="f:${f.id}"
     title="${esc(sub?folderPath(f.id):f.name)}">${tw}${ic('folder',sub?15:16)}
    <span class="lbl">${esc(f.name)}</span>
    <span class="fm" data-a="menu" data-p="fmenu:${f.id}" title="Folder options">${ic('dots',14)}</span>
    ${cnt(folderCount(f.id))}</a>`;
}
function folderRows(f){
  const kids=subFolders(f.id);
  if(!kids.length||!S.openF[f.id])return folderRow(f,false);
  return folderRow(f,false)+kids.map(k=>folderRow(k,true)).join('')+
    `<a class="sub" data-a="newfolder" data-p="${f.id}" style="color:var(--ter)"
       title="${esc(addFolderLabel(f.id))}">${ic('folderplus',15)}
      <span class="lbl">${esc(addFolderLabel(f.id))}</span></a>`;
}

     ${v(S.view==='all','home','All meetings',cnt(all),'view','all')}

}

/* ══════════════════════════════════ meters ══════════════════════════════════ */
function meterBars(n,live,seedv=0){
  let out='';
  for(let i=0;i<n;i++){
    const h=live?Math.max(4,Math.round(6+30*Math.abs(Math.sin(i*0.7+seedv))*Math.abs(Math.cos(i*0.31+seedv*0.6))))
                :4+((i*7)%4);
    out+=`<i style="height:${h}px"></i>`;}
  return `<span class="meter ${live?'live':'idle'}">${out}</span>`;
}
