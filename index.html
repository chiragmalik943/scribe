<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIT-Scribe — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════ tokens ══════════════════════════════ */
:root{
  --rail:#FFF8F4; --surf:#FFFFFF; --sunk:#FDF8F5; --scrim:rgba(42,31,27,.34);
  --line:#F0E4DE; --line2:#E7D8D0;
  --ink:#2A1F1B; --ink2:#4A3D38; --sec:#736360; --ter:#786864;
  --brand:#B34C2D; --brandOn:#FFFFFF; --brandInk:#9C4529; --tint:#FCEEE9; --tint2:#FDF6F3;
  --danger:#B93E2F; --dangerInk:#A5301F; --dangerTint:#FDF1EF; --dangerLine:#F3D9D4;
  --warn:#B54708; --warnInk:#8F3A08; --warnTint:#FFF8EC; --warnLine:#F5E3C6;
  --ok:#0A7548; --okInk:#07603B; --okTint:#EDFAF2; --okLine:#CDEBDB;
  --info:#175CD3; --infoTint:#EFF6FF;
  --shadow:0 24px 70px rgba(42,31,27,.22),0 2px 8px rgba(42,31,27,.09);
  --shadow2:0 16px 40px rgba(42,31,27,.16);
  --backdrop:#E7E0D8;
  --meterOff:#E5D6CF;
}
[data-theme="dark"]{
  --rail:#141010; --surf:#1B1614; --sunk:#241D1A; --scrim:rgba(0,0,0,.58);
  --line:#302724; --line2:#3E3230;
  --ink:#F8F2EE; --ink2:#E3D8D2; --sec:#B7A9A3; --ter:#AC9E98;
  --brand:#D9764F; --brandOn:#1B1614; --brandInk:#F0A183; --tint:#38211A; --tint2:#2A1A16;
  --danger:#C94A38; --dangerInk:#F3A093; --dangerTint:#381D19; --dangerLine:#4E2A24;
  --warn:#B26A16; --warnInk:#F0BB70; --warnTint:#33240F; --warnLine:#4A3518;
  --ok:#1C8A57; --okInk:#79D3A7; --okTint:#122D20; --okLine:#1F4433;
  --info:#5B95F0; --infoTint:#16243B;
  --shadow:0 24px 70px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --shadow2:0 16px 40px rgba(0,0,0,.45);
  --backdrop:#0C0908;
  --meterOff:#4A3B36;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,'Liberation Sans',Arial,sans-serif;background:var(--backdrop);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:background .25s}
.h{font-family:Poppins,sans-serif}
svg{display:block;flex:0 0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ══════════════════════════════ window frame ══════════════════════════════ */
#frame.zoom{box-shadow:none}
#frame{width:1440px;height:900px;background:var(--surf);border-radius:14px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);
  transform-origin:center center;transition:background .25s}
.app{display:flex;height:900px;position:relative}

/* ══════════════════════════════ rail ══════════════════════════════ */
.rail{width:240px;flex:0 0 240px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 12px 14px;transition:width .18s,flex-basis .18s,background .25s}
.app.railmin .rail{width:104px;flex:0 0 104px;padding:0 12px 14px}
.app.railmin .rail .lbl,.app.railmin .rail .setupcard,.app.railmin .rail .acct .who,
.app.railmin .rail .upg,.app.railmin .subnav{display:none}
.app.railmin .nav a{justify-content:center;padding:0}
.app.railmin .acct{justify-content:center;padding:8px}
.brandrow{display:flex;align-items:center;gap:12px;height:64px;padding:0 6px}
.lights{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.lights i{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:rgba(0,0,0,.5)}
.lights i svg{opacity:0;width:9px;height:9px}
.lights:hover i svg{opacity:1}
.lights .r{background:#FF5F57}.lights .y{background:#FEBC2E}.lights .g{background:#28C840}
[data-theme="dark"] .lights .r{background:#E0443E}[data-theme="dark"] .lights .y{background:#DEA123}
[data-theme="dark"] .lights .g{background:#1AAB29}
.brandrow .tg{color:var(--sec);width:30px;height:30px;border-radius:8px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.brandrow .tg:hover,.tbtn:hover{background:var(--sunk)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:14px;height:36px;padding:0 10px;border-radius:8px;
  font-family:Poppins,sans-serif;font-size:14px;font-weight:500;color:var(--ink2);
  text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.nav a .ic{color:var(--sec)}
.nav a.on .ic{color:var(--brandInk)}
.subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 2px 26px;
  border-left:1.5px solid var(--line2);padding-left:12px}
.subnav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;
  font-size:12.5px;color:var(--sec);cursor:pointer}
.subnav a:hover{background:var(--sunk)}
.subnav a.on{background:var(--tint2);color:var(--brandInk);font-weight:600}
.spacer{flex:1}
.setupcard{border:1px solid var(--line2);background:var(--surf);border-radius:12px;padding:14px;
  margin-bottom:10px;cursor:pointer}
.setupcard:hover{border-color:var(--brand)}
.setupcard .t{display:flex;align-items:center;justify-content:space-between;
  font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600}
.setupcard .t span{font-size:11px;font-weight:600;color:var(--brandInk);background:var(--tint);
  padding:2px 8px;border-radius:20px}
.setupcard .s{font-size:12px;color:var(--sec);margin:8px 0 12px;line-height:1.4}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--tint)}
.segs i.f{background:var(--brand)}
.acct{display:flex;flex-direction:column;gap:10px;padding:11px;border-radius:12px;
  border:1px solid var(--line2);background:var(--surf);overflow:hidden}
.acct .top{display:flex;align-items:center;gap:10px;min-width:0;width:100%}
.acct .who{min-width:0;flex:1}
.avat{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;
  font-size:12px;font-weight:600;flex:0 0 auto}
.acct .nm{font-size:13px;font-weight:600;line-height:1.25;display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.acct .pl{font-size:11.5px;color:var(--sec);display:block}
.upg{width:100%;justify-content:center;display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:Poppins,sans-serif;font-size:12px;font-weight:600;color:var(--ink2);
  border:1px solid var(--line2);border-radius:8px;padding:7px 11px;background:var(--surf)}
.upg:hover{border-color:var(--brand);color:var(--brandInk)}

/* ══════════════════════════════ list column ══════════════════════════════ */
.listcol{width:280px;flex:0 0 280px;background:var(--surf);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.app.listmin .listcol{display:none}
.lhead{height:64px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lhead b{font-family:Poppins,sans-serif;font-size:15px;font-weight:600}
.lhead .act{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:Poppins,sans-serif;
  font-size:12.5px;font-weight:600;color:var(--brandInk)}
.srch{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line2);
  border-radius:8px;padding:8px 11px;margin:16px 16px 0;flex:0 0 auto}
.srch:focus-within{border-color:var(--brand)}
.srch input{font-size:13px;width:100%}
.srch input::placeholder{color:var(--ter)}
.lbody{padding:16px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.views{display:flex;flex-direction:column;gap:2px}
.views a{display:flex;align-items:center;gap:12px;min-height:34px;padding:6px 10px;border-radius:8px;
  font-size:13.5px;color:var(--ink2);cursor:pointer}
.views a:hover{background:var(--sunk)}
.views a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.views a .ic{color:var(--sec)}
.views a.on .ic{color:var(--brandInk)}
.views a .n{margin-left:auto;font-size:12px;color:var(--sec)}
.views a.on .n{color:var(--brandInk);font-weight:700}
.views a .pill{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--danger);
  border-radius:10px;padding:1px 7px}
.slabel{font-family:Poppins,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ter);padding:18px 10px 8px}
.note{margin-top:14px;padding:11px 12px;border:1px dashed var(--line2);border-radius:10px;
  font-size:12px;color:var(--sec);line-height:1.45}
.emptylist{padding:28px 20px;text-align:center;font-size:12.5px;color:var(--sec);line-height:1.5}
.emptylist b{display:block;color:var(--ink2);font-size:13.5px;font-family:Poppins,sans-serif;
  font-weight:600;margin-bottom:6px}
.convrow{display:block;padding:11px 12px;border-radius:9px;cursor:pointer}
.convrow:hover{background:var(--sunk)}
.convrow.on{background:var(--tint)}
.convrow .t{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;display:block}
.convrow.on .t{color:var(--brandInk)}
.convrow .d{font-size:11.5px;color:var(--sec);margin-top:4px;display:block}

/* ══════════════════════════════ main ══════════════════════════════ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surf)}
.mhead{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.mhead h1{font-family:Poppins,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.mhead .state{font-size:13.5px;color:var(--sec);white-space:nowrap}
.mhead .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--sec);position:relative;flex:0 0 auto}
.tbtn.hasbadge:after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;
  border-radius:50%;background:var(--danger);border:1.5px solid var(--surf)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--sec)}
.crumb .bk{cursor:pointer;display:flex;align-items:center;gap:6px}
.crumb .bk:hover{color:var(--brandInk)}
.crumb b{color:var(--ink);font-weight:600;font-family:Poppins,sans-serif;font-size:15px}
.body{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column}

/* ══════════════════════════════ buttons ══════════════════════════════ */
.btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-family:Poppins,sans-serif;
  font-size:13px;font-weight:600;border-radius:9px;padding:8px 15px;border:1px solid transparent;
  white-space:nowrap;cursor:pointer}
.btn.p{background:var(--brand);color:var(--brandOn)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{background:var(--surf);color:var(--ink2);border-color:var(--line2)}
.btn.s:hover{background:var(--sunk)}
.btn.t{background:transparent;color:var(--brandInk);padding:7px 9px}
.btn.t:hover{background:var(--tint2)}
.btn.d{background:var(--danger);color:#fff}
.btn.d:hover{filter:brightness(1.08)}
.btn.sm{font-size:12.5px;padding:6px 12px}
.btn.dis{background:var(--sunk);color:var(--ter);border-color:var(--line);cursor:not-allowed}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.link{font-family:Poppins,sans-serif;font-size:12.5px;font-weight:600;color:var(--brandInk);cursor:pointer}
.link:hover{text-decoration:underline}

/* ══════════════════════════════ generic ══════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty .ico{width:60px;height:60px;border-radius:50%;background:var(--tint2);display:flex;
  align-items:center;justify-content:center;color:var(--brand);margin-bottom:18px}
.empty h2{font-family:Poppins,sans-serif;font-size:20px;font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;color:var(--sec);line-height:1.6;max-width:470px}
.notice{display:flex;align-items:center;gap:11px;border-radius:12px;padding:12px 14px;
  font-size:13.5px;line-height:1.45}
.notice .act{margin-left:auto}
.notice.warn{background:var(--warnTint);border:1px solid var(--warnLine);color:var(--ink2)}
.notice.warn .ic{color:var(--warnInk)}
.notice.ok{background:var(--okTint);border:1px solid var(--okLine);color:var(--ink2)}
.notice.ok .ic{color:var(--okInk)}
.notice.dg{background:var(--dangerTint);border:1px solid var(--dangerLine);color:var(--ink2)}
.notice.dg .ic{color:var(--dangerInk)}
.kbd{flex:0 0 auto;font-size:12px;font-weight:700;background:var(--surf);border:1px solid var(--line2);
  border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--ink);display:inline-block}
.ghd{display:flex;align-items:center;gap:8px;font-family:Poppins,sans-serif;font-size:11.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);margin:0 2px 10px}
.ghd.dg{color:var(--dangerInk)}
.ghd .n{color:var(--ter);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.meter{display:flex;align-items:center;gap:3px;height:38px;overflow:hidden}
.meter i{width:3px;border-radius:2px;background:var(--brand);transition:height .12s}
.meter.idle i{background:var(--meterOff)}
.meter.live i{background:var(--danger)}
.tog{width:44px;height:25px;border-radius:14px;background:var(--line2);position:relative;
  flex:0 0 auto;cursor:pointer;transition:background .16s}
.tog.on{background:var(--brand)}
.tog i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:left .16s}
.tog.on i{left:22px}
.tog.dis{opacity:.5;cursor:not-allowed}
.inp{border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:13px;
  background:var(--surf);display:flex;align-items:center;gap:8px}
.inp:focus-within{border-color:var(--brand)}
.inp input{width:100%}
.inp input::placeholder,.inp .ph{color:var(--ter)}
.sel{border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:13px;
  background:var(--surf);display:inline-flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.sel:hover{border-color:var(--brand)}
.cbx{width:18px;height:18px;border-radius:5px;border:1.8px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:var(--surf);cursor:pointer;color:transparent}
.cbx.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rdo{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--line2);flex:0 0 auto;cursor:pointer}
.rdo.on{border:5px solid var(--brand)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:6px;padding:2px 8px;font-family:Poppins,sans-serif;background:var(--sunk);color:var(--sec)}
.pri.hi{background:var(--dangerTint);color:var(--dangerInk)}
.pri.md{background:var(--warnTint);color:var(--warnInk)}
.pri.ok{background:var(--okTint);color:var(--okInk)}
.fchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);
  border:1px solid var(--line2);border-radius:9px;padding:7px 13px;background:var(--surf);
  cursor:pointer;white-space:nowrap}
.fchip:hover{background:var(--sunk)}
.fchip.on{background:var(--tint);color:var(--brandInk);font-weight:600;border-color:transparent}
.fchip .b{font-size:11px;font-weight:700;color:#fff;background:var(--danger);border-radius:9px;padding:0 6px}
.fchip.on .b{background:var(--brand)}
/* ══════════════════════════════ meetings ══════════════════════════════ */
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow:hover{background:var(--sunk)}
.mrow .t{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;display:block}
.mrow .s{font-size:12.5px;color:var(--sec);display:block;margin-top:3px}
.mrow .rt{text-align:right;white-space:nowrap;flex:0 0 auto;min-width:118px}
.mrow .rt .tg{font-size:12px;font-weight:600;font-family:Poppins,sans-serif;display:block}
.mrow .rt .mt{font-size:12px;color:var(--sec);display:block;margin-top:4px}
.mrow>span:first-child{flex:1;min-width:0}
.mrow .macts{display:flex;gap:4px;flex:0 0 auto;opacity:0;pointer-events:none}
.mrow:hover .macts{opacity:1;pointer-events:auto}
.mrow .macts span{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--sec);background:var(--surf);border:1px solid var(--line2)}
.mrow .macts span:hover{border-color:var(--brand);color:var(--brandInk)}
.mrow .macts span.dg:hover{border-color:var(--danger);color:var(--dangerInk)}
.mrow .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:#fff;background:var(--danger);border-radius:20px;padding:2px 9px;font-family:Poppins,sans-serif}
.setuphd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.setuphd b{font-family:Poppins,sans-serif;font-size:14px}
.setuphd .step{font-size:12px;font-weight:600;color:var(--brandInk);background:var(--tint);
  padding:2px 9px;border-radius:20px}
.setuphd .x{margin-left:auto;color:var(--sec);cursor:pointer}
.setuprow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.setuprow+.setuprow{border-top:1px solid var(--line)}
.setuprow .si{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--brandInk);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.setuprow .t{font-family:Poppins,sans-serif;font-size:14px;font-weight:600;display:block}
.setuprow .s{font-size:12.5px;color:var(--sec);display:block;margin-top:3px;line-height:1.45;max-width:620px}
.setuprow .a{margin-left:auto;flex:0 0 auto}

/* ══════════════════════════════ meeting detail ══════════════════════════════ */
.titleblk{margin-bottom:16px}
.titleblk h1{font-family:Poppins,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.015em}
.titleblk h1 .edit{opacity:0;color:var(--sec);display:inline-flex;vertical-align:2px;margin-left:8px;
  pointer-events:none}
.titleblk:hover h1 .edit{opacity:1}
.metarow{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;color:var(--sec);flex-wrap:wrap}
.metarow .fchipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--ink2);font-weight:600;
  font-family:Poppins,sans-serif;cursor:pointer}
.metarow .fchipx:hover{border-color:var(--brand)}
.metarow .sp{width:3px;height:3px;border-radius:50%;background:var(--ter)}
.faces{display:flex;align-items:center}
.faces i{width:24px;height:24px;border-radius:50%;border:2px solid var(--surf);margin-left:-7px;
  font-style:normal;font-size:10.5px;font-weight:700;color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:Poppins,sans-serif}
.faces i:first-child{margin-left:0}

<script>

/* ══════════════════════════════════ meters ══════════════════════════════════ */
function meterBars(n,live,seedv=0){
  let out='';
  for(let i=0;i<n;i++){
    const h=live?Math.max(4,Math.round(6+30*Math.abs(Math.sin(i*0.7+seedv))*Math.abs(Math.cos(i*0.31+seedv*0.6))))
                :4+((i*7)%4);
    out+=`<i style="height:${h}px"></i>`;}
  return `<span class="meter ${live?'live':'idle'}">${out}</span>`;
}

        let tx=esc(t[2]);
        if(q)tx=tx.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
        return `<div class="trs ${t[3]?'hl':''}"><span class="tm" data-a="jump" data-p="${t[0]}">${t[0]}</span>
          <span><span class="spk">${esc(t[1])}</span><span class="tx">${tx}</span>
          ${t[3]?`<span class="badge">${ic('list',12)}${t[3]}</span>`:''}</span></div>`}).join('')
        :`<div class="hint" style="padding:24px 4px">Nothing in this transcript matches.</div>`}</div>
      ${player(m)}`;
  }
  return `<div class="body">${titleBlock(m,`<span class="sp"></span><span>${m.dur}</span>`)}
    ${mytasks.length&&S.tab==='notes'&&!m.ackd?`<div class="notice ok" style="margin-bottom:18px">${ic('check',17)}
      <span><b>${mytasks.length} follow-up${mytasks.length>1?'s':''} added to Tasks</b> — owners and dates taken from what was said.</span>
      <span class="act"><button class="btn t sm" data-a="ackNotes" data-p="${m.id}">Dismiss</button></span></div>`:''}
    ${body}</div>`;
}
function player(m){
  const bars=[];for(let i=0;i<80;i++)bars.push(6+Math.round(18*Math.abs(Math.sin(i*0.55))*Math.abs(Math.cos(i*0.23))));
  return `<div class="player"><span class="pb" data-a="playpause">${ic(S.playing?'pause':'play',15,2)}</span>
    <span class="tm">${fmtPos(m)}</span>
    <span class="scrub" data-a="seek">${bars.map((h,i)=>
      `<i class="${i<S.playPos?'p':''}" style="height:${h}px"></i>`).join('')}</span>
    <span class="tm">${m.dur}</span>
    <button class="btn s sm" data-a="demo" data-p="change playback speed">1&times;</button></div>`;
}
function fmtPos(m){
  const total=parseInt(m.dur.split(':')[0])*60+parseInt(m.dur.split(':')[1]);
  const s=Math.round(total*S.playPos/80);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function taskRow(t,compact){
  const m=meeting(t.mid);
  return `<div class="trk ${t.done?'done':''} ${S.tid===t.id&&S.panel?'sel':''}" data-a="opentask" data-p="${t.id}">
    <span class="cbx ${t.done?'on':''}" data-a="toggletask" data-p="${t.id}">${ic('check',12,2.6)}</span>

}

function viewTasks(){
  let list=db.tasks.slice();
  if(S.view==='overdue')list=list.filter(t=>t.late&&!t.done);
  else if(S.view==='upcoming')list=list.filter(t=>t.grp==='Upcoming'&&!t.done);
  else if(S.view==='done')list=list.filter(t=>t.done);
  else if(S.view.startsWith('m:'))list=list.filter(t=>t.mid===S.view.slice(2));
  if(S.view!=='done'&&!S.showDone)list=list.filter(t=>!t.done);
  if(S.taskFilter==='overdue')list=list.filter(t=>t.late);
  if(S.taskFilter==='today')list=list.filter(t=>t.grp==='Today');
  if(S.taskFilter==='upcoming')list=list.filter(t=>t.grp==='Upcoming');
  if(S.q)list=list.filter(t=>t.title.toLowerCase().includes(S.q.toLowerCase()));
  const o=openTasks().length,od=overdue().length;
  const toolbar=db.tasks.length?`<div class="toolrow">
    ${[['all','All',o],['overdue','Overdue',od],['today','Today',0],['upcoming','Upcoming',0]].map(([k,l,n])=>
      `<span class="fchip ${S.taskFilter===k?'on':''}" data-a="tfilter" data-p="${k}">${l}${
        n?`<span class="b">${n}</span>`:''}</span>`).join('')}

      <input placeholder="Search follow-ups" data-a="q" value="${esc(S.q)}"></span>

    </span></div>`:'';
  const add=`<div class="addrow">${ic('plus',17)}

  if(!list.length) return `<div class="body">${toolbar}${add}
    <div class="empty" style="padding-bottom:60px"><span class="ico">${ic('checkc',27,1.5)}</span>
    <h2>${db.tasks.length?'Nothing here':'No follow-ups yet'}</h2>

      'Follow-ups appear here automatically after each meeting is summarised. You can add one in the field above at any time.'}</p></div></div>`;

function chart(vals,days,tipIdx,tipA,tipB){
  const max=Math.max(...vals)||1,H=120;
  const cols=vals.map((val,i)=>{
    const h=val?Math.max(3,Math.round(val/max*H)):3;
    const tip=i===tipIdx?`<span class="ttip" style="bottom:${Math.max(8,h-46)}px;left:50%;transform:translateX(-50%)">
      <b>${tipA}</b>${tipB}</span>`:'';
    return `<span class="col">${tip}<span class="bar ${val?'':'mute'}" style="height:${h}px"></span></span>`;}).join('');
  const grid=[0.5,1].map(f=>`<span class="gridl" style="bottom:${Math.round(f*H)+9}px">
    <span>${Math.round(max*f)}</span></span>`).join('');
  return `<div style="padding-left:38px"><div class="chart">${grid}${cols}</div>
    <div class="xax">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>`;
}

function notesMd(m){
  const L=[];
  L.push('# '+m.title,'');
  L.push(`_${m.day}, ${m.time} · ${m.dur} · ${folderName(m.folder)}_`,'');
  L.push('**Participants:** '+m.people.map(p=>p.n).join(', '),'');
  if(m.notes.summary){L.push('## Summary','',m.notes.summary,'')}
  if(m.notes.decisions.length){L.push('## Decisions','');
    m.notes.decisions.forEach(d=>L.push(`- ${d[0]} _(${d[1]})_`));L.push('')}
  if(m.notes.questions.length){L.push('## Open questions','');
    m.notes.questions.forEach(d=>L.push(`- ${d[0]} _(${d[1]})_`));L.push('')}
  const ts=db.tasks.filter(t=>t.mid===m.id);
  if(ts.length){L.push('## Follow-ups','');
    ts.forEach(t=>L.push(`- [${t.done?'x':' '}] ${t.title} — ${t.due}`));L.push('')}
  if(m.mynotes){L.push('## My notes','',m.mynotes,'')}
  L.push('---','Generated by AIT-Scribe');
  return L.join('\n');
}
function copyText(t,label){
  const done=()=>toast(`<b>Copied.</b> ${label}`);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;
    a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy');done()}catch(e){toast('Could not reach the clipboard.')}
    a.remove();}
}
function download(name,text){
  const b=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
  toast(`<b>Downloaded.</b> ${esc(name)}`);
}

  case 'pastekey':stop();db.settings.anthropicKey='sk-ant-api03-demo-key-not-real';render();
    toast('Key pasted. Conversation mode can now be turned on.');return;
  case 'connect':stop();db.settings[p]=true;render();
    toast(`<b>${p==='gmail'?'Gmail':p==='gcal'?'Google Calendar':'Slack'} connected.</b> The assistant can now use it — and will still ask first.`);return;
  case 'addname':{stop();const n=prompt('Another name people call you');
    if(n&&n.trim()){db.settings.names.push(n.trim());render()}return;}
  case 'govocab':stop();S.settings=false;S.route='vocabulary';S.view='all';render();return;
  case 'resetDemo':stop();S.settings=false;resetDemo(true);return;
  case 'reloadDemo':stop();S.settings=false;resetDemo(false);return;
  case 'tfilter':stop();S.taskFilter=p;render();return;
  case 'showdone':stop();S.showDone=!S.showDone;render();return;
  case 'toggletask':{stop();const t=task(p);t.done=!t.done;render();
    toast(t.done?`<b>Done.</b> ${esc(t.title)}`:'Marked not done.');return;}
  case 'opentask':stop();S.tid=p;S.panel=true;S.menu=null;S.route='tasks';render();return;
  case 'closepanel':stop();S.panel=false;render();return;
  case 'setpri':{stop();const [id,k]=p.split('|');task(id).pri=k;S.menu=null;render();
    toast('Priority updated.');return;}
  case 'cyclepri':{stop();const t=task(p);const o=['','md','hi'];
    t.pri=o[(o.indexOf(t.pri)+1)%3];render();return;}
  case 'deltask':stop();db.tasks=db.tasks.filter(t=>t.id!==p);S.menu=null;S.panel=false;render();
    toast('Follow-up deleted.');return;
  case 'holdstart':stop();holdStart();return;
  case 'copytx':stop();toast('Transcript copied to your clipboard.');return;
  case 'deltx':stop();db.transcripts=db.transcripts.filter(t=>t.id!==p);render();toast('Transcript deleted.');return;
  case 'delterm':stop();db.vocab=db.vocab.filter(v=>v.t!==p);render();toast(`“${esc(p)}” removed from your vocabulary.`);return;
  case 'focusterm':stop();{const i=document.querySelector('[data-a="addterm"]');if(i)i.focus();}return;
  case 'convo':stop();S.cid=p;render();return;
  case 'newchat':stop();S.cid='new';render();return;
  case 'ask':{stop();if(el.classList.contains('chip')){askAssistant(p);return}
    const i=document.querySelector('#askbox');if(i)i.focus();return;}
  case 'asksend':{stop();const i=document.querySelector('#askbox');
    if(i&&i.value.trim()){const q=i.value;i.value='';askAssistant(q)}return;}
  case 'askSend':stop();toast('The assistant answers from this meeting once you send.');return;
  case 'clearq':stop();S.q='';render();return;
  case 'win':{stop();
    if(p==='close')demo('close the window');
    else if(p==='min')demo('minimize AIT-Scribe to the Dock');
    else{S.zoom=!S.zoom;const f=$('#frame');
      f.style.borderRadius=S.zoom?'0':'14px';
      f.classList.toggle('zoom',S.zoom);fit();
      toast(S.zoom?'Zoomed to fill the screen.':'Restored.');}
    return;}
  case 'addperson':stop();S.addPerson=p;render();
    setTimeout(()=>{const i=document.querySelector('#pname');if(i)i.focus()},60);return;
  case 'closeperson':stop();S.addPerson=false;render();return;
  case 'saveperson':{stop();const n=(document.querySelector('#pname')||{}).value||'';
    const em=(document.querySelector('#pmail')||{}).value||'';
    if(!n.trim()){toast('A name is needed — the email is optional.');return}
    const m=meeting(p);const init=n.trim()[0].toUpperCase();
    const pal=['#B34C2D','#175CD3','#0A7548','#7C3AED','#B54708','#0E7490','#BE185D','#4D7C0F'];
    m.people.push({n:n.trim(),i:init,c:pal[m.people.length%pal.length],e:em.trim()});
    S.addPerson=false;render();
    toast(`<b>${esc(n.trim())} added.</b> ${em.trim()?'They can be sent the notes.':'No email — they will not receive the notes.'}`);
    return;}
  case 'copymd':{stop();S.menu=null;const m=meeting(p);
    copyText(notesMd(m),'Markdown notes are on your clipboard.');render();return;}
  case 'dlmd':{stop();S.menu=null;const m=meeting(p);
    download(slug(m.title)+'.md',notesMd(m));render();return;}
  case 'spk':stop();S.speakers=p;render();return;
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='q'){S.q=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="q"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='tq'){S.tq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="tq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='vq'){S.vq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="vq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='key'){db.settings.anthropicKey=el.value;}
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest('[data-a]');
  if(e.key==='Enter'&&el){
    const a=el.dataset.a;
    if(a==='addtask'&&el.value.trim()){
      db.tasks.unshift({id:'u'+Date.now(),title:el.value.trim(),mid:null,due:'No date',late:false,
        pri:'',done:false,grp:'Today',quote:'',who:'',at:''});
      el.value='';render();toast('Follow-up added.');return;}
    if(a==='addterm'&&el.value.trim()){
      db.vocab.unshift({t:el.value.trim(),h:'—',n:0,s:'you'});el.value='';render();
      toast('Term added. It applies to dictation and meetings.');return;}
    if(a==='ask'&&el.value.trim()){const q=el.value;el.value='';askAssistant(q);return;}
    if(a==='key'){db.settings.anthropicKey=el.value;render();return;}
  }
  if(e.key==='Enter'&&S.addPerson&&(e.target.id==='pname'||e.target.id==='pmail')){
    const b=document.querySelector('[data-a="saveperson"]');if(b)b.click();}
  if(e.key==='Escape'){
    if(S.addPerson){S.addPerson=false;render();return}
    if(S.menu){S.menu=null;render();return}
    if(S.share){S.share=false;render();return}
    if(S.settings){S.settings=false;render();return}
    if(S.panel){S.panel=false;render();return}
  }
  if(e.key===','&&(e.metaKey||e.ctrlKey)){e.preventDefault();S.settings=true;S.spane='appearance';render()}
});

/* ══════════════════════════════════ boot ══════════════════════════════════ */
let SCALE=1;
function fit(){
  const f=$('#frame');const pad=S.zoom?0:40;
  SCALE=Math.min(1,(window.innerWidth-pad)/1440,(window.innerHeight-pad)/900);
  f.style.transform=`scale(${SCALE})`;
}
window.addEventListener('resize',fit);
fit();render();
setTimeout(()=>toast('<b>AIT-Scribe prototype.</b> Everything is clickable — try <b>Record meeting</b>, or switch to dark mode in Settings.',5200),700);
</script>
</body>
</html>
