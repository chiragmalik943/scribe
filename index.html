function viewMeetings(){
  let list=db.meetings.slice();
  if(S.view==='recent')list=list.filter(m=>['Today','Yesterday'].includes(m.group));
  if(S.q)list=list.filter(m=>(m.title+' '+m.people.map(p=>p.n).join(' ')+' '+
    m.transcript.map(t=>t[2]).join(' ')).toLowerCase().includes(S.q.toLowerCase()));
  const setup=db.setupDone<3?`<div class="card" style="margin-bottom:22px">
    <div class="setuphd"><b>Finish setting up</b><span class="step">${3-db.setupDone} steps left</span>
      <span class="x" data-a="dismissSetup">${ic('x',15)}</span></div>
    <div class="setuprow"><span class="si">${ic('rec',17)}</span>
      <span><span class="t">Never miss a call</span><span class="s">Spot Zoom, Meet, Teams calls and Slack
      huddles, and offer to take notes. Without this, nothing is recorded or filed automatically.</span></span>
      <span class="a"><button class="btn ${db.settings.detect?'s':'p'} sm" data-a="toggleDetect">${
        db.settings.detect?ic('check',14)+'Call detection on':'Turn on call detection'}</button></span></div>
    <div class="setuprow"><span class="si">${ic('cal',17)}</span>
      <span><span class="t">See what's coming up</span><span class="s">Connect Google Calendar for your
      schedule and a nudge before each call. Optional.</span></span>
      <span class="a"><button class="btn s sm" data-a="connectCal">${
        db.settings.calendar?ic('check',14)+'Connected':'Connect calendar'}</button></span></div></div>`:'';
  if(!list.length) return `<div class="body">${setup}
    <div class="empty" style="${setup?'justify-content:flex-start;padding-top:64px':''}">
      <span class="ico">${ic('cal',27,1.5)}</span>
      <h2>${S.q?'No meetings match':'No meetings yet'}</h2>
      <p>${S.q?'Try a different search, or clear it to see everything.':
        'Turn on call detection and AIT-Scribe will take the notes, work out which folder the call belongs in, and file it for you. You can also record one now.'}</p>
      ${S.q?'<button class="btn s sm" style="margin-top:16px" data-a="clearq">Clear search</button>':''}
    </div></div>`;
  const groups=[];
  list.forEach(m=>{let g=groups.find(x=>x.g===m.group);if(!g){g={g:m.group,items:[]};groups.push(g)}g.items.push(m)});
  const done=db.setupDone>=3&&!db.dismissedOk?`<div class="notice ok" style="margin-bottom:20px">${ic('check',17)}
    <span><b>Setup complete.</b> Call detection is on — AIT-Scribe will offer to take notes when your next call starts.</span>
    <span class="act"><button class="btn t sm" data-a="dismissOk">Dismiss</button></span></div>`:'';
  return `<div class="body">${setup}${done}${groups.map(g=>`
    <div class="ghd">${g.g} <span class="n">· ${g.items.length} meeting${g.items.length>1?'s':''}</span></div>
    <div class="card" style="margin-bottom:22px">${g.items.map(m=>{
      const live=S.rec&&S.rec.mid===m.id;
      return `<div class="mrow" data-a="open" data-p="${m.id}">
      <span><span class="t">${esc(m.title)}</span>
        <span class="s">${m.people.map(p=>p.n).join(', ')} · ${live?'recording now':m.dur}</span></span>
      ${live?'':`<span class="macts">
        <span data-a="menu" data-p="folder:${m.id}" title="Move to folder">${ic('folder',14)}</span>
        <span data-a="share" data-p="${m.id}" title="Share">${ic('share',14)}</span>
        <span class="dg" data-a="confirmDelete" data-p="${m.id}" title="Delete">${ic('trash',14)}</span></span>`}
      <span class="rt">${live?`<span class="live">${ic('rec',12)}Recording</span>`:
        `<span class="tg" style="color:${folderColor(m.folder)}">${esc(folderPath(m.folder))}</span>
         <span class="mt">${m.time} · ${taskCount(m.id)} task${taskCount(m.id)===1?'':'s'}</span>`}</span></div>`}).join('')}
    </div>`).join('')}</div>`;
}
/* ══════════════════════════════════ folder detail ══════════════════════════════════ */
/* One row per meeting, shared by the folder page and the Unfiled page. `showFolder`
   forces the move-to-folder control visible, which is the whole point of Unfiled. */
function meetingRow(m,showFolder){
  const live=S.rec&&S.rec.mid===m.id;
  return `<div class="mrow" data-a="open" data-p="${m.id}">
    <span><span class="t">${esc(m.title)}</span>
      <span class="s">${m.people.length} attendee${m.people.length===1?'':'s'} · ${
        live?'recording now':m.dur}</span></span>
    ${live?'':`<span class="macts" ${showFolder?'style="opacity:1;pointer-events:auto"':''}>
      <span data-a="menu" data-p="folder:${m.id}" title="Move to folder">${ic('folder',14)}</span>
      <span data-a="share" data-p="${m.id}" title="Share">${ic('share',14)}</span>
      <span class="dg" data-a="confirmDelete" data-p="${m.id}" title="Delete">${ic('trash',14)}</span></span>`}
    <span class="rt">${live?`<span class="live">${ic('rec',12)}Recording</span>`:
      `<span class="tg" style="color:${folderColor(m.folder)}">${esc(folderPath(m.folder))}</span>
       <span class="mt">${m.time} · ${taskCount(m.id)} task${taskCount(m.id)===1?'':'s'}</span>`}</span></div>`;
}
function viewFolder(){
  const id=S.fid,unfiled=id==='';
  const f=folder(id);
  if(!unfiled&&!f)return `<div class="body"><div class="empty"><h2>Folder not found</h2>
    <p>It may have been deleted.</p>
    <button class="btn s sm" style="margin-top:16px" data-a="go" data-p="meetings">All meetings</button></div></div>`;
  const kids=unfiled?[]:subFolders(id);
  const isTop=!unfiled&&!f.parent;
  const own=db.meetings.filter(m=>m.folder===id);
  const all=folderMeetings(id);
  const tasks=folderTasks(id);

  const head=`<div class="fhead">
    <span class="fi">${ic(unfiled?'file':'folder',21)}</span>
    <span class="ft"><h1 class="h" ${unfiled?'':`data-a="renamefolder" data-p="${id}" style="cursor:text"`}>${
        esc(unfiled?'Unfiled':f.name)}${unfiled?'':`<span class="edit">${ic('edit',15)}</span>`}</h1>
      <span class="fs">${unfiled?'Not in a folder yet'
        :isTop?`Top-level folder${kids.length?` · ${kids.length} folder${kids.length>1?'s':''}`:''}`
        :`In ${esc(folderName(f.parent))}`}
        <span class="sp" style="width:3px;height:3px;border-radius:50%;background:var(--ter)"></span>
        <span>${all.length} meeting${all.length===1?'':'s'}</span>
        ${tasks.length?`<span class="sp" style="width:3px;height:3px;border-radius:50%;background:var(--ter)"></span>
          <span>${tasks.length} open task${tasks.length===1?'':'s'}</span>`:''}</span></span>
    <span class="fa">
      ${isTop?`<button class="btn p sm" data-a="newfolder" data-p="${id}">${
        ic('folderplus',15)}${esc(addFolderLabel(id))}</button>`:''}
      ${unfiled?'':`<button class="btn s sm" data-a="menu" data-p="fmenu:${id}">${ic('dots',15)}</button>`}
    </span></div>`;

  /* Unfiled is the one page whose job is to get meetings out of it */
  if(unfiled){
    return `<div class="body">${head}
      <div class="notice info" style="margin-bottom:20px">${ic('info',17)}
        <span><b>These calls have no folder.</b> AIT-Scribe could not tell where they belonged, or
        filing was off when they were recorded. Use ${ic('folder',13)} on a row — or the folder chip
        inside a meeting — to move one, and you can create a folder from the same menu.</span></div>
      ${all.length?`<div class="card">${all.map(m=>meetingRow(m,true)).join('')}</div>`
        :`<div class="empty" style="padding-bottom:60px"><span class="ico">${ic('check',27,1.5)}</span>
          <h2>Everything is filed</h2><p>Nothing is waiting for a folder.</p></div>`}</div>`;
  }

  /* A top-level folder leads with its sub-folders; a sub-folder has none, so it
     leads with the notes rolled up across the calls filed in it. */
  const cards=isTop?`<div class="ghd">Folders <span class="n">· ${kids.length}</span></div>
    <div class="fcards">${kids.map(k=>{
      const km=folderMeetings(k.id),kt=folderTasks(k.id);
      return `<div class="fcard" data-a="view" data-p="f:${k.id}">
        <div class="top"><span class="fi">${ic('folder',16)}</span>
          <span class="nm">${esc(k.name)}</span>
          <span class="fm" data-a="menu" data-p="fmenu:${k.id}" title="Folder options">${ic('dots',14)}</span></div>
        <div class="ds">${esc(folderSummary(k.id))}</div>
        <div class="mt"><b>${km.length}</b> meeting${km.length===1?'':'s'}
          ${kt.length?`<span>·</span><b>${kt.length}</b> open task${kt.length===1?'':'s'}`:''}</div></div>`}).join('')}
      <div class="fcard add" data-a="newfolder" data-p="${id}">
        ${ic('folderplus',20)}<span class="nm">${esc(addFolderLabel(id))}</span></div></div>`:'';

  const roll=isTop?'':rollup(id);

  const mlist=`<div class="ghd">${isTop?'Meetings in this folder':'Meetings'}
      <span class="n">· ${(isTop?own:all).length}</span>${
      isTop&&all.length>own.length?`<span class="n" style="margin-left:auto;text-transform:none;
        letter-spacing:0">${all.length-own.length} more in its folders</span>`:''}</div>
    ${(isTop?own:all).length?`<div class="card">${(isTop?own:all).map(m=>meetingRow(m)).join('')}</div>`
      :`<div class="card" style="padding:26px 20px;text-align:center;font-size:13px;color:var(--sec)">
        ${isTop?'No meetings sit directly in this folder — they are all in its sub-folders.'
          :'Nothing filed here yet.'}</div>`}`;

  return `<div class="body">${head}${cards}${roll}${mlist}</div>`;
}
/* Summary, decisions, open questions and open tasks, read across every meeting
   filed in the folder. */
function rollup(id){
  const dec=folderLines(id,'decisions'),qs=folderLines(id,'questions'),tasks=folderTasks(id);
  const src=l=>`<span class="from" data-a="open" data-p="${l.mid}" title="${
    esc(l.mt)} · ${l.at}">${esc(l.mt.length>22?l.mt.slice(0,21)+'…':l.mt)} &rsaquo;</span>`;
  return `<div class="rollgrid" style="margin-bottom:24px">
    <div>
      <div class="sec"><h3>${ic('spark',15)}Summary</h3><p>${esc(folderSummary(id))}</p></div>
      ${dec.length?`<div class="sec"><h3>${ic('checkc',15)}Decisions <span class="n"
          style="font-weight:500;color:var(--ter);font-size:12px">· ${dec.length}</span></h3>
        <ul class="bul">${dec.map(l=>`<li><span class="dot"></span><span>${esc(l.tx)}</span>${src(l)}</li>`).join('')}</ul></div>`:''}
      ${qs.length?`<div class="sec"><h3>${ic('alertc',15)}Open questions <span class="n"
          style="font-weight:500;color:var(--ter);font-size:12px">· ${qs.length}</span></h3>
        <ul class="bul">${qs.map(l=>`<li><span class="dot"></span><span>${esc(l.tx)}</span>${src(l)}</li>`).join('')}</ul></div>`:''}
      ${!dec.length&&!qs.length?`<div class="sec"><p style="color:var(--sec)">No decisions or open
        questions have come out of these calls yet.</p></div>`:''}
    </div>
    <div><div class="sec"><h3>${ic('list',15)}Open tasks
      <span class="jump" data-a="go" data-p="tasks">View in Tasks &rsaquo;</span></h3>
      ${tasks.length?`<div class="card">${tasks.map(t=>taskRow(t,true)).join('')}</div>`
        :`<div class="card" style="padding:22px;text-align:center;font-size:13px;color:var(--sec)">
          Nothing open from this folder.</div>`}</div></div></div>`;
}

/* ══════════════════════════════════ meeting detail ══════════════════════════════════ */
/* Avatars only, capped so a twelve-person all-hands does not push the meta row
   onto a second line — the remainder becomes a +N chip. Names live in the
   attendee popover now. */
function faces(m,max=6){
  const shown=m.people.slice(0,max),rest=m.people.length-shown.length;
  return `<span class="faces">${shown.map(p=>
    `<i style="background:${p.c}" title="${esc(p.n)}">${p.i}</i>`).join('')}${
    rest>0?`<i class="more" title="${esc(m.people.slice(max).map(x=>x.n).join(', '))}">+${rest}</i>`:''}</span>`;
}
function titleBlock(m,extra){
  return `<div class="titleblk"><h1 class="h" data-a="rename" data-p="${m.id}" style="cursor:text">${esc(m.title)}
      <span class="edit">${ic('edit',15)}</span></h1>
    <div class="metarow">${faces(m)}
      <span class="attx" data-a="menu" data-p="people:${m.id}" title="Attendees">${
        m.people.length} attendee${m.people.length===1?'':'s'} ${ic('chevd',12)}</span><span class="sp"></span>
      <span>${m.day}, ${m.time}</span>${extra}<span class="sp"></span>
      <span class="fchipx" data-a="menu" data-p="folder:${m.id}">${ic('folder',14)}${esc(folderPath(m.folder))} ${ic('chevd',12)}</span>
    </div></div>`;
}
function viewMeeting(){
  const m=meeting(S.mid);if(!m)return `<div class="body"><div class="empty"><h2>Meeting not found</h2></div></div>`;
  const rec=S.rec&&S.rec.mid===m.id;
  const tabs=`<div class="tabs">
    ${rec?`<a class="${S.tab==='mynotes'?'on':''}" data-a="tab" data-p="mynotes">My notes</a>
      <a class="off">${ic('spark',14)}AI notes <span class="cnt">after you stop</span></a>
      <a class="${S.tab==='transcript'?'on':''}" data-a="tab" data-p="transcript">Transcript <span class="cnt">live</span></a>`
     :`<a class="${S.tab==='notes'?'on':''}" data-a="tab" data-p="notes">${ic('spark',14)}AI notes</a>
      <a class="${S.tab==='mynotes'?'on':''}" data-a="tab" data-p="mynotes">My notes</a>
      <a class="${S.tab==='transcript'?'on':''}" data-a="tab" data-p="transcript">Transcript</a>`}</div>`;
  let body='';
  if(rec){
    const r=S.rec,mm=String(Math.floor(r.secs/60)).padStart(2,'0'),ss=String(r.secs%60).padStart(2,'0');
    body=`<div class="recbar ${r.paused?'pause':''}"><span class="rdot"></span>
      <b>${r.paused?'Paused':'Recording'}</b><span class="t">${mm}:${ss}</span>
      <span class="s">· ${r.paused?'nothing is being captured':'both sides captured'}</span>
      <span class="a"><button class="btn s sm" data-a="pauseRec">${r.paused?ic('play',14)+'Resume':ic('pause',14)+'Pause'}</button>
        <button class="btn d sm" data-a="stopRec">${ic('stop',14)}Stop &amp; generate notes</button></span></div>
     <div style="margin-top:12px">${meterBars(74,!r.paused,r.secs)}</div>${tabs}`;
    if(S.tab==='transcript'){
      body+=`<div style="flex:1;overflow-y:auto">${r.lines.map(l=>
        `<div class="trs"><span class="tm">${l[0]}</span><span><span class="spk">${l[1]}</span>
          <span class="tx">${esc(l[2])}</span></span></div>`).join('')||
        `<div class="hint" style="padding:20px 4px">Listening… lines appear here as people speak.</div>`}</div>`;
    }else{
      body+=`<div class="notebox"><div class="ln" contenteditable="true" data-a="noop">${
        esc(m.mynotes).replace(/\n/g,'<br>')}</div>
        <div class="hint" style="margin-top:10px">Jot key points as they come up — AI notes expand them into
        a summary, decisions and tasks when you stop.</div></div>`;
    }
    body+=`<div class="comp"><div class="compbox" data-a="mchat" style="cursor:pointer">${ic('spark',17)}
      <span style="flex:1;font-size:13.5px;color:var(--ter)">Ask anything about this meeting so far…</span>
      <span class="sendb">${ic('send',15,2)}</span></div></div>`;
    return `<div class="body">${titleBlock(m,'')}${body}</div>`;
  }
  if(S.busy){
    return `<div class="body">${titleBlock(m,`<span class="sp"></span><span>${m.dur}</span>`)}
      <div class="empty"><span class="ico">${ic('spark',27,1.5)}</span>
      <h2>Generating notes…</h2><p>Reading your notes and the transcript together. This usually takes a few seconds.</p>
      <div style="margin-top:18px" class="typing"><i></i><i></i><i></i></div></div></div>`;
  }
  const mytasks=db.tasks.filter(t=>t.mid===m.id);
  if(S.tab==='notes'){
    body=`${tabs}<div class="notesgrid">
      <div>
        <div class="sec"><h3>${ic('file',15)}Summary</h3><p>${esc(m.notes.summary)}</p></div>
        ${m.notes.decisions.length?`<div class="sec"><h3>${ic('checkc',15)}Decisions</h3><ul class="bul">
          ${m.notes.decisions.map(d=>`<li><span class="dot"></span><span>${esc(d[0])}</span>
            <span class="jump" data-a="jump" data-p="${d[1]}">${d[1]} &rsaquo;</span></li>`).join('')}</ul></div>`:''}
        ${m.notes.questions.length?`<div class="sec"><h3>${ic('alertc',15)}Open questions</h3><ul class="bul">
          ${m.notes.questions.map(d=>`<li><span class="dot"></span><span>${esc(d[0])}</span>
            <span class="jump" data-a="jump" data-p="${d[1]}">${d[1]} &rsaquo;</span></li>`).join('')}</ul></div>`:''}
      </div>
      <div><div class="sec"><h3>${ic('list',15)}Tasks / Action Items
        <span class="jump" data-a="go" data-p="tasks">View in Tasks &rsaquo;</span></h3>
        ${mytasks.length?`<div class="card">${mytasks.map(t=>taskRow(t,true)).join('')}</div>`
          :`<div class="card" style="padding:22px;text-align:center;font-size:13px;color:var(--sec)">
            No tasks came out of this meeting.</div>`}</div></div></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sec);
        padding:14px 2px 12px;border-top:1px solid var(--line);flex-wrap:wrap">${ic('spark',14)}
        Generated ${m.genAt||'2:49 pm'} from your notes and the transcript.
        <span style="margin-left:auto;display:flex;gap:8px">
          <button class="btn s sm" data-a="copymd" data-p="${m.id}">${ic('copy',14)}Copy as Markdown</button>
          <button class="btn s sm" data-a="dlmd" data-p="${m.id}">${ic('md',14)}Download .md</button>
          <button class="btn s sm" data-a="regen" data-p="${m.id}">${ic('rec',14)}Regenerate</button>
          <button class="btn s sm" data-a="confirmDelete" data-p="${m.id}"
            style="color:var(--dangerInk);border-color:var(--dangerLine)">${ic('trash',14)}Delete</button>
        </span></div>`;
  } else if(S.tab==='mynotes'){
    body=`${tabs}<div class="notebox" style="flex:1"><div class="ln" contenteditable="true">${
      esc(m.mynotes).replace(/\n/g,'<br>')}</div></div>`;
  } else {
    const spk=['All speakers',...new Set(m.transcript.map(t=>t[1]))];
    const q=S.tq.toLowerCase();
    const rows=m.transcript.filter(t=>(S.speakers==='All speakers'||t[1]===S.speakers)&&
      (!q||t[2].toLowerCase().includes(q)));
    body=`${tabs}<div class="toolrow">
      <span class="srch" style="margin:0;width:250px">${ic('search',15)}
        <input placeholder="Search this transcript" data-a="tq" value="${esc(S.tq)}"></span>
      ${spk.map(s=>`<span class="fchip ${S.speakers===s?'on':''}" data-a="spk" data-p="${esc(s)}">${esc(s)}</span>`).join('')}
      <span class="r"><button class="btn s sm" data-a="demo" data-p="copy the transcript to your clipboard">${ic('copy',15)}Copy</button>
        <button class="btn s sm" data-a="demo" data-p="export the transcript">${ic('down',15)}Export</button></span></div>
      <div style="flex:1;overflow-y:auto">${rows.length?rows.map(t=>{
        let tx=esc(t[2]);
        if(q)tx=tx.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
        return `<div class="trs ${t[3]?'hl':''}"><span class="tm" data-a="jump" data-p="${t[0]}">${t[0]}</span>
          <span><span class="spk">${esc(t[1])}</span><span class="tx">${tx}</span>
          ${t[3]?`<span class="badge">${ic('list',12)}${t[3]}</span>`:''}</span></div>`}).join('')
        :`<div class="hint" style="padding:24px 4px">Nothing in this transcript matches.</div>`}</div>
      ${player(m)}`;
  }
  return `<div class="body">${titleBlock(m,`<span class="sp"></span><span>${m.dur}</span>`)}
    ${mytasks.length&&S.tab==='notes'&&!m.ackd?`<div class="notice ok" style="margin-bottom:18px">${ic('check',17)}
      <span><b>${mytasks.length} task${mytasks.length>1?'s':''} added to Tasks</b> — owners and dates taken from what was said.</span>
      <span class="act"><button class="btn t sm" data-a="ackNotes" data-p="${m.id}">Dismiss</button></span></div>`:''}
    ${body}</div>`;
}
function player(m){
  const bars=[];for(let i=0;i<80;i++)bars.push(6+Math.round(18*Math.abs(Math.sin(i*0.55))*Math.abs(Math.cos(i*0.23))));
  return `<div class="player"><span class="pb" data-a="playpause">${ic(S.playing?'pause':'play',15,2)}</span>
    <span class="tm">${fmtPos(m)}</span>
    <span class="scrub" data-a="seek">${bars.map((h,i)=>
      `<i class="${i<S.playPos?'p':''}" style="height:${h}px"></i>`).join('')}</span>
    <span class="tm">${m.dur}</span>
    <button class="btn s sm" data-a="demo" data-p="change playback speed">1&times;</button></div>`;
}
function fmtPos(m){
  const total=parseInt(m.dur.split(':')[0])*60+parseInt(m.dur.split(':')[1]);
  const s=Math.round(total*S.playPos/80);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function taskRow(t,compact){
  const m=meeting(t.mid);
  return `<div class="trk ${t.done?'done':''} ${S.tid===t.id&&S.panel?'sel':''}" data-a="opentask" data-p="${t.id}">
    <span class="cbx ${t.done?'on':''}" data-a="toggletask" data-p="${t.id}">${ic('check',12,2.6)}</span>
    <span style="flex:1"><span class="t">${esc(t.title)}</span>
      <span class="m">${t.pri?`<span class="pri ${t.pri}">${ic('flag',12)}${t.pri==='hi'?'High':'Medium'}</span>`:''}
        ${ic('users',13)}${m?esc(m.title):'Added by you'}</span></span>
    <span class="due ${t.late&&!t.done?'dg':''}">${t.done?'Done':t.due}</span>
    ${compact?'':`<span class="kb2" data-a="menu" data-p="task:${t.id}">${ic('dots',16)}</span>`}</div>`;
}

/* ══════════════════════════════════ tasks ══════════════════════════════════ */
function viewTasks(){
  let list=db.tasks.slice();
  if(S.view==='overdue')list=list.filter(t=>t.late&&!t.done);
  else if(S.view==='upcoming')list=list.filter(t=>t.grp==='Upcoming'&&!t.done);
  else if(S.view==='done')list=list.filter(t=>t.done);
  else if(S.view.startsWith('m:'))list=list.filter(t=>t.mid===S.view.slice(2));
  if(S.view!=='done'&&!S.showDone)list=list.filter(t=>!t.done);
  if(S.taskFilter==='overdue')list=list.filter(t=>t.late);
  if(S.taskFilter==='today')list=list.filter(t=>t.grp==='Today');
  if(S.taskFilter==='upcoming')list=list.filter(t=>t.grp==='Upcoming');
  if(S.q)list=list.filter(t=>t.title.toLowerCase().includes(S.q.toLowerCase()));
  const o=openTasks().length,od=overdue().length;
  const toolbar=db.tasks.length?`<div class="toolrow">
    ${[['all','All',o],['overdue','Overdue',od],['today','Today',0],['upcoming','Upcoming',0]].map(([k,l,n])=>
      `<span class="fchip ${S.taskFilter===k?'on':''}" data-a="tfilter" data-p="${k}">${l}${
        n?`<span class="b">${n}</span>`:''}</span>`).join('')}
    <span class="r"><span class="srch" style="margin:0;width:210px">${ic('search',15)}
      <input placeholder="Search tasks" data-a="q" value="${esc(S.q)}"></span>
      <span class="chk" data-a="showdone"><span class="cbx ${S.showDone?'on':''}">${ic('check',12,2.6)}</span>Show completed</span>
      <button class="btn s sm" data-a="demo" data-p="switch to a calendar view">${ic('cal',15)}Calendar view</button>
    </span></div>`:'';
  const add=`<div class="addrow">${ic('plus',17)}
    <input placeholder="Add a task…" data-a="addtask"></div>`;
  if(!list.length) return `<div class="body">${toolbar}${add}
    <div class="empty" style="padding-bottom:60px"><span class="ico">${ic('checkc',27,1.5)}</span>
    <h2>${db.tasks.length?'Nothing here':'No tasks yet'}</h2>
    <p>${db.tasks.length?'No tasks match this view. Try another filter.':
      'Tasks appear here automatically after each meeting is summarised. You can add one in the field above at any time.'}</p></div></div>`;
  const order=['Overdue','Today','Upcoming','Done'];
  const groups=order.map(g=>({g,items:list.filter(t=>(t.done?'Done':t.grp)===g)})).filter(x=>x.items.length);
  return `<div class="body">${toolbar}${add}
    ${groups.map(g=>`<div class="ghd ${g.g==='Overdue'?'dg':''}">${g.g==='Overdue'?ic('alertc',14):''}${g.g}</div>
      <div class="card" style="margin-bottom:20px">${g.items.map(t=>taskRow(t)).join('')}</div>`).join('')}</div>`;
}
/* ══════════════════════════════════ speech to text ══════════════════════════════════ */

  const live=!!S.rec2;
  let list=db.transcripts.filter(t=>S.view==='today'?t.when==='today':true);
  if(S.q)list=list.filter(t=>t.tx.toLowerCase().includes(S.q.toLowerCase()));
  const secs=live?S.rec2.secs:0;
  const card=live?`<div class="card" style="padding:20px;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <span class="holdbtn live">${ic('mic',19,2)}Listening…</span>
        <span><span class="statusline"><span class="d" style="background:var(--danger)"></span>
          Recording · MacBook Air Microphone · release <span class="kbd">${db.settings.hotkey}</span> to paste</span>
          <span class="sub">On device · audio never leaves your Mac</span></span>
        <span style="margin-left:auto;font-family:Poppins;font-size:15px;font-weight:600;color:var(--dangerInk)">
          0:${String(secs).padStart(2,'0')}</span></div>
      <div style="margin-top:18px">${meterBars(78,true,secs)}</div></div>`
    :`<div class="card" style="padding:20px;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <span class="holdbtn" data-a="holdstart">${ic('mic',19,2)}Hold <span class="kb">${db.settings.hotkey}</span> to talk</span>
        <span><span class="statusline"><span class="d" style="background:var(--ok)"></span>
          Ready · MacBook Air Microphone · text pastes at your cursor</span>
          <span class="sub">On device · audio never leaves your Mac</span></span></div>
      <div style="margin-top:18px">${meterBars(78,false)}</div>
      <div style="font-size:12.5px;color:var(--sec);margin-top:6px">Input level — hold
        <span class="kbd">${db.settings.hotkey}</span> and speak to check your microphone is being heard.
        <span class="link" data-a="holdstart" style="margin-left:8px">Try it in the demo &rsaquo;</span></div></div>`;
  const warn=db.settings.hotkey==='Fn'?`<div class="notice warn" style="margin-bottom:22px">${ic('alert',17)}
    <span><b>macOS also uses Fn</b> for the emoji picker. Dictation still works, but you may see both.</span>
    <span class="act"><button class="btn s sm" data-a="settings" data-p="hotkey">Change key</button></span></div>`:'';
  const rows=list.length?`<div class="card">${list.map(t=>`<div class="trow">
      ${ic('file',16)}<span style="flex:1"><span class="tx" contenteditable="true">${esc(t.tx)}</span>
        <span class="tm">${t.time} · ${t.dest}</span></span>
      <span class="acts">
        <span data-a="demo" data-p="focus the line for editing" title="Edit">${ic('edit',14)}</span>
        <span data-a="copytx" data-p="${t.id}" title="Copy">${ic('copy',14)}</span>
        <span data-a="demo" data-p="replay the original audio" title="Play">${ic('play',14)}</span>
        <span class="dg" data-a="deltx" data-p="${t.id}" title="Delete">${ic('trash',14)}</span></span></div>`).join('')}</div>`
    :`<div class="card" style="padding:34px 20px;text-align:center">
      <div style="font-size:13.5px;color:var(--sec);line-height:1.6">Nothing dictated yet ${S.view==='today'?'today':'in this range'}.<br>
      Hold <span class="kbd">${db.settings.hotkey}</span> anywhere on your Mac and your words land where the cursor is.</div></div>`;
  const metrics=db.transcripts.length?`<div class="metrics"><span><b>96%</b> kept after editing</span>
    <span class="sp"></span><span><b>1.2s</b> average hold to paste</span><span class="sp"></span>
    <span><b>${db.vocab.filter(v=>v.s==='ai').length}</b> terms learned from your corrections</span></div>`:'';
  return `<div class="body">${card}${warn}
    <div class="ghd">${S.view==='today'?'Today':S.view==='week'?'This week':'All transcripts'}
      <span class="n">· ${list.length} transcript${list.length===1?'':'s'}</span></div>
    ${rows}${metrics}</div>`;
}

/* ══════════════════════════════════ vocabulary ══════════════════════════════════ */

  let list=db.vocab.slice();
  if(S.view==='you')list=list.filter(v=>v.s==='you');
  if(S.view==='ai')list=list.filter(v=>v.s==='ai');
  if(S.vq)list=list.filter(v=>(v.t+' '+v.h).toLowerCase().includes(S.vq.toLowerCase()));
  return `<div class="body">
   <div style="font-size:13.5px;color:var(--sec);line-height:1.6;max-width:660px;margin-bottom:18px">
     Words AIT&#8209;Scribe should get right — names, products and acronyms. These apply to both dictation
     and meeting transcripts.</div>
   <div class="toolrow"><button class="btn s sm" data-a="demo" data-p="import a term list from a file">${ic('down',15)}Import a list</button>
     <button class="btn s sm" data-a="demo" data-p="export your vocabulary">${ic('copy',15)}Export</button>
     <span class="r" style="font-size:12.5px;color:var(--sec)">Sorted by how often you corrected them</span></div>
   <div class="addrow" style="margin-bottom:16px">${ic('plus',17)}
     <input placeholder="Add a term AIT-Scribe keeps getting wrong…" data-a="addterm"></div>
   <div class="card" style="overflow:hidden">
    <table class="vtable"><thead><tr><th>Term</th><th>Often heard as</th><th>Corrected</th><th>Source</th><th></th></tr></thead>
     <tbody>${list.length?list.map((v,i)=>`<tr>
       <td class="tm">${esc(v.t)}</td><td>${esc(v.h)}</td><td>${v.n}&times;</td>
       <td><span class="pillx ${v.s==='ai'?'ai':''}">${v.s==='ai'?'Learned':'Added by you'}</span></td>
       <td style="text-align:right"><span class="kb2" style="opacity:1;display:inline-flex;cursor:pointer"
         data-a="delterm" data-p="${esc(v.t)}">${ic('trash',15)}</span></td></tr>`).join('')
       :`<tr><td colspan="5" style="text-align:center;padding:34px;color:var(--sec)">No terms match.</td></tr>`}
     </tbody></table></div>
   <div style="display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--sec);margin-top:16px">
     ${ic('info',14)}Terms marked <span class="pillx ai">Learned</span> were added automatically when you
     edited a transcript. You can remove any of them.</div></div>`;
}

function chart(vals,days,tipIdx,tipA,tipB){
  const max=Math.max(...vals)||1,H=120;
  const cols=vals.map((val,i)=>{
    const h=val?Math.max(3,Math.round(val/max*H)):3;
    const tip=i===tipIdx?`<span class="ttip" style="bottom:${Math.max(8,h-46)}px;left:50%;transform:translateX(-50%)">
      <b>${tipA}</b>${tipB}</span>`:'';
    return `<span class="col">${tip}<span class="bar ${val?'':'mute'}" style="height:${h}px"></span></span>`;}).join('');
  const grid=[0.5,1].map(f=>`<span class="gridl" style="bottom:${Math.round(f*H)+9}px">
    <span>${Math.round(max*f)}</span></span>`).join('');
  return `<div style="padding-left:38px"><div class="chart">${grid}${cols}</div>
    <div class="xax">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>`;
}

/* A side panel rather than a tab, so a question can be asked while the notes or
   the transcript stay on screen. The thread lives on the meeting, so switching
   tabs — or leaving and coming back — keeps it. */
const MCHIPS=[['What did I commit to?','list'],['Summarise this call','file'],
              ['What was left unresolved?','alertc'],['Draft a recap email','send']];
function meetingChat(m){
  if(!m)return '';

  return `<div class="panel chat"><div class="ph">${ic('spark',17)}<b>Ask about this meeting</b>
    <span style="margin-left:auto;display:flex;gap:4px">

        ic('reset',17)}</span>`:''}
      <span class="tbtn" data-a="mchat" title="Close">${ic('x',17)}</span></span></div>
   <div class="pb2">
    ${msgs.length?msgs.map(x=>`<div class="msg ${x.r}">
        <span class="who">${x.r==='u'?db.user.initial:ic('spark',14,2)}</span>
        <span class="tx">${x.tx}</span></div>`).join('')
      :`<div class="cempty">Ask anything about <b>${esc(m.title)}</b> — the assistant reads this
        call's transcript and notes only, and answers from what was actually said.
        <div class="cchips">${MCHIPS.map(([q,i])=>
          `<span data-a="mask" data-p="${esc(q)}">${ic(i,15)}${q}</span>`).join('')}</div></div>`}
    ${S.mtyping?`<div class="msg a"><span class="who">${ic('spark',14,2)}</span>
      <span class="tx typing"><i></i><i></i><i></i></span></div>`:''}
   </div>
   <div class="cfoot"><div class="comp"><div class="compbox">
     <span class="ic" data-a="demo" data-p="dictate your question">${ic('mic',16)}</span>
     <input placeholder="Ask about this meeting…" data-a="mask" id="mbox">
     <span class="sendb" data-a="msend">${ic('send',15,2)}</span></div></div></div></div>`;
}
/* Canned but not random: each answer is assembled from this meeting's own notes,
   tasks and transcript, so it stays true to whatever is on screen. */
function meetingAnswer(m,q){
  const l=q.toLowerCase();
  const ts=db.tasks.filter(t=>t.mid===m.id);
  const cite=` <span class="src" data-a="jump" data-p="${(m.transcript[0]||['00:00'])[0]}">${
    ic('users',13)}${esc(m.title)} · from the transcript</span>`;
  if(/commit|task|action|owe|follow/.test(l))
    return ts.length?`You took ${ts.length} thing${ts.length>1?'s':''} away from this call:<br>${
      ts.map((t,i)=>`&nbsp;&nbsp;${i+1}.&nbsp; ${esc(t.title)} — <b>${esc(t.due)}</b>.`).join('<br>')}`+
      `<br>All of them are already on your task list.`
      :'Nothing was committed on this call — no task came out of it.';
  if(/summar|recap|overview|what happened|about/.test(l)&&!/email|draft/.test(l))
    return esc(m.notes.summary||'This call has not been summarised yet.')+cite;
  if(/draft|email|write|send/.test(l))
    return `Here is a recap you could send:<br><br>Hi ${esc((m.people.find(x=>x.n!=='you')||{n:'there'}).n.split(' ')[0])},<br><br>`+
      `Thanks for the time today. ${esc((m.notes.summary||'').split('.')[0])}.`+
      (m.notes.decisions.length?` To confirm what we agreed: ${
        m.notes.decisions.map(d=>esc(d[0].replace(/\.$/,'').toLowerCase())).join('; ')}.`:'')+
      `<br><br>Best,<br>${esc(db.user.name.split(' ')[0])}`;
  if(/unresolved|open|question|unanswered|unclear/.test(l))
    return m.notes.questions.length?`${m.notes.questions.length} thing${
      m.notes.questions.length>1?'s were':' was'} left open:<br>${
      m.notes.questions.map(x=>`&nbsp;&nbsp;·&nbsp; ${esc(x[0])} <b>(${x[1]})</b>`).join('<br>')}`
      :'Nothing was left hanging — every question raised on this call got an answer.';
  if(/decide|decision|agree/.test(l))
    return m.notes.decisions.length?`${m.notes.decisions.length} decision${
      m.notes.decisions.length>1?'s':''} came out of it:<br>${
      m.notes.decisions.map(d=>`&nbsp;&nbsp;·&nbsp; ${esc(d[0])} <b>(${d[1]})</b>`).join('<br>')}`
      :'No decisions were recorded on this call.';
  if(/who|attend|people|present/.test(l))
    return `${m.people.length} people were on it: ${esc(m.people.map(x=>
      x.n==='you'?db.user.name:x.n).join(', '))}.`;
  if(/when|time|how long|durat/.test(l))
    return `${esc(m.day)} at ${esc(m.time)}, and it ran ${m.dur}.`;
  return `I can only answer from this call. Here is what it covered:<br><br>${
    esc(m.notes.summary||'No notes have been generated for it yet.')}${cite}`;
}
function askMeeting(q){
  const m=meeting(S.mid);if(!m||!q.trim())return;
  m.chat=m.chat||[];
  m.chat.push({r:'u',tx:esc(q.trim())});
  S.mtyping=true;render();
  const el=document.querySelector('.panel.chat .pb2');if(el)el.scrollTop=el.scrollHeight;
  setTimeout(()=>{
    S.mtyping=false;
    m.chat.push({r:'a',tx:meetingAnswer(m,q)});
    render();
    const e2=document.querySelector('.panel.chat .pb2');if(e2)e2.scrollTop=e2.scrollHeight;
    const i=document.querySelector('#mbox');if(i)i.focus();
  },1100);
}

/* ── floating bubble ──────────────────────────────────────────────────────
   An always-on control that in the real app floats over other windows. It lives
   in #bubble, a sibling of #app, so a re-render never interrupts a drag or drops
   the CSS :hover that reveals the tray.

   Click the core to start dictating, click again to stop. Hover reveals Dictate,
   Record, Ask and More. Drag it anywhere in the window; More ▸ Reset position
   puts it back. */
const BUBACTS=[['record','rec','Record a meeting'],['ask','spark','Ask the assistant'],
               ['more','dots','More']];
/* bottom right, but clear of the action row that sits along the foot of a
   meeting's notes — the bubble is draggable if the user wants it elsewhere */
function bubHome(){return {x:FW()-88,y:FH()-152};}
function renderBubble(){
  const el=$('#bubble');if(!el)return;
  const b=S.bub;
  if(!db.settings.bubble){el.className='off';el.innerHTML='';return}
  if(b.x===null){const h=bubHome();b.x=h.x;b.y=h.y;}
  /* keep it inside the frame after a resize or a switch to fill mode; the
     bottom margin leaves room for the label that sits under the core */
  b.x=Math.max(8,Math.min(b.x,FW()-68));
  b.y=Math.max(72,Math.min(b.y,FH()-96));
  /* the tray needs ~150px of headroom, so drop it below the core near the top */
  el.className=(b.rec?'rec ':'')+(b.y<226?'flip':'');
  el.style.left=b.x+'px';el.style.top=b.y+'px';
  const mm=Math.floor(b.secs/60),ss=String(b.secs%60).padStart(2,'0');
  el.innerHTML=`<div class="btray">${BUBACTS.map(([k,i,l])=>
      `<span data-a="bubact" data-p="${k}" title="${l}">${ic(i,17)}<span class="tip">${l}</span></span>`).join('')}</div>
    <div class="bcore" data-a="bubtalk" title="${b.rec?'Stop and paste':'Click to dictate'}">
      ${b.rec?`${ic('stop',14,2.6)}<span class="tm">${mm}:${ss}</span>
        <span class="bmeter">${Array.from({length:9},(_,i)=>
          `<i style="height:${Math.max(3,Math.round(3+6*Math.abs(Math.sin(i*0.9+b.secs))))}px"></i>`).join('')}</span>`
             :ic('mic',22,2)}</div>
    <div class="blabel">${b.rec?'Listening — click to paste':'Click to dictate'}</div>`;
}
/* Click-to-start, click-to-stop. Distinct from holdStart(), which models the
   press-and-hold hotkey and releases itself after a few seconds. */
function bubStart(){
  if(S.bub.rec)return;
  if(S.rec2)holdStop();
  S.bub.rec=true;S.bub.secs=0;
  clearTimers();
  timers.push(setInterval(()=>{
    if(!S.bub.rec)return;
    S.bub.secs++;renderBubble();
    /* the Speech to Text page mirrors the live session while it runs */
    if(S.route==='speech'){S.rec2={secs:S.bub.secs,bub:true};render()}
  },1000));
  if(S.route==='speech'){S.rec2={secs:0,bub:true};render()}
  renderBubble();
  toast(`${ic('mic',15)}<span><b>Listening.</b> Click the bubble again to paste at your cursor.</span>`,2800,'info');
}
function bubStop(){
  if(!S.bub.rec)return;
  const secs=S.bub.secs;
  S.bub.rec=false;S.bub.secs=0;S.rec2=null;clearTimers();
  const samples=['Ask Legal how long the addendum review usually takes',
    'Confirm the seat count with Jennifer before the pricing goes out',
    'Move the migration window to after the training block',
    'Draft the scorecard for the backend candidate this afternoon'];
  const tx=samples[Math.floor(Date.now()/1000)%samples.length];
  db.transcripts.unshift({id:'s'+Date.now(),tx,time:'just now',
    dest:'pasted at your cursor · from the bubble',when:'today'});
  render();
  toast(`${ic('check',15)}<span><b>Pasted.</b> “${esc(tx.slice(0,40))}…” after ${secs}s.</span>`,3000,'ok');
}

/* drops the collapse control in just before the list column closes */
function withFoot(lc){const i=lc.lastIndexOf('</div>');return lc.slice(0,i)+lfoot()+lc.slice(i);}
function notesMd(m){
  const L=[];
  L.push('# '+m.title,'');
  L.push(`_${m.day}, ${m.time} · ${m.dur} · ${folderName(m.folder)}_`,'');
  L.push('**Participants:** '+m.people.map(p=>p.n).join(', '),'');
  if(m.notes.summary){L.push('## Summary','',m.notes.summary,'')}
  if(m.notes.decisions.length){L.push('## Decisions','');
    m.notes.decisions.forEach(d=>L.push(`- ${d[0]} _(${d[1]})_`));L.push('')}
  if(m.notes.questions.length){L.push('## Open questions','');
    m.notes.questions.forEach(d=>L.push(`- ${d[0]} _(${d[1]})_`));L.push('')}
  const ts=db.tasks.filter(t=>t.mid===m.id);
  if(ts.length){L.push('## Tasks','');
    ts.forEach(t=>L.push(`- [${t.done?'x':' '}] ${t.title} — ${t.due}`));L.push('')}
  if(m.mynotes){L.push('## My notes','',m.mynotes,'')}
  L.push('---','Generated by AIT-Scribe');
  return L.join('\n');
}
function copyText(t,label){
  const done=()=>toast(`<b>Copied.</b> ${label}`);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;
    a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy');done()}catch(e){toast('Could not reach the clipboard.')}
    a.remove();}
}
function download(name,text){
  const b=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
  toast(`<b>Downloaded.</b> ${esc(name)}`);
}
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function meetingsState(){
  const n=db.meetings.length;if(!n)return 'No meetings yet';
  const wk=db.meetings.filter(m=>['Today','Yesterday','Monday'].includes(m.group)).length;
  return `${n} meeting${n>1?'s':''} · ${wk} this week`;
}

function askAssistant(q){

  if(!c||S.cid==='new'){c={id:'c'+Date.now(),title:q.length>40?q.slice(0,40)+'…':q,when:'Just now',msgs:[]};
    db.convos.unshift(c);S.cid=c.id;}

  case 'mask':{stop();
    /* a suggestion chip carries its question in data-p; the input does not */
    if(p){askMeeting(p);return}
    const i=document.querySelector('#mbox');
    if(i&&i.value.trim()){const q=i.value;i.value='';askMeeting(q)}
    else if(i)i.focus();
    return;}
  case 'msend':{stop();const i=document.querySelector('#mbox');
    if(i&&i.value.trim()){const q=i.value;i.value='';askMeeting(q)}return;}
  case 'mclear':{stop();const m=meeting(p);if(m)m.chat=[];render();
    toast('Thread cleared.');return;}
  /* ── attendees ──────────────────────────────────────────────────────── */
  case 'delperson':{stop();const [mid,ix]=p.split('|');const m=meeting(mid);
    const who=m.people[+ix];
    if(!who||who.n==='you')return;
    m.people.splice(+ix,1);render();
    toast(`<b>${esc(who.n)} removed.</b> They will not be sent the notes.`,2800,'warn');return;}
  case 'addperson':stop();S.settings=false;S.menu=null;S.addPerson=p;render();
    setTimeout(()=>{const i=document.querySelector('#pname');if(i)i.focus()},60);return;
  case 'closeperson':stop();S.addPerson=false;render();return;
  case 'saveperson':{stop();const n=(document.querySelector('#pname')||{}).value||'';
    const em=(document.querySelector('#pmail')||{}).value||'';
    if(!n.trim()){toast('A name is needed — the email is optional.');return}
    const m=meeting(p);const init=n.trim()[0].toUpperCase();
    const pal=['#C24600','#1570EF','#0A7548','#7C3AED','#8A5300','#0E7490','#BE185D','#4D7C0F'];
    m.people.push({n:n.trim(),i:init,c:pal[m.people.length%pal.length],e:em.trim()});
    S.addPerson=false;render();
    toast(`<b>${esc(n.trim())} added.</b> ${em.trim()?'They can be sent the notes.':'No email — they will not receive the notes.'}`);
    return;}
  case 'copymd':{stop();S.menu=null;const m=meeting(p);
    copyText(notesMd(m),'Markdown notes are on your clipboard.');render();return;}
  case 'dlmd':{stop();S.menu=null;const m=meeting(p);
    download(slug(m.title)+'.md',notesMd(m));render();return;}
  case 'spk':stop();S.speakers=p;render();return;
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='q'){S.q=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="q"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='tq'){S.tq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="tq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='vq'){S.vq=el.value;const pos=el.selectionStart;render();
    const n=document.querySelector('[data-a="vq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(a==='key'){db.settings.anthropicKey=el.value;}
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest('[data-a]');
  if(e.key==='Enter'&&el){
    const a=el.dataset.a;
    if(a==='addtask'&&el.value.trim()){
      db.tasks.unshift({id:'u'+Date.now(),title:el.value.trim(),mid:null,due:'No date',late:false,
        pri:'',done:false,grp:'Today',quote:'',who:'',at:''});
      el.value='';render();toast('Task added.');return;}
    if(a==='addterm'&&el.value.trim()){
      db.vocab.unshift({t:el.value.trim(),h:'—',n:0,s:'you'});el.value='';render();
      toast('Term added. It applies to dictation and meetings.');return;}
    if(a==='ask'&&el.value.trim()){const q=el.value;el.value='';askAssistant(q);return;}
    if(a==='mask'&&el.value.trim()){const q=el.value;el.value='';askMeeting(q);return;}
    if(a==='key'){db.settings.anthropicKey=el.value;render();return;}
  }
  if(e.key==='Enter'&&S.addPerson&&(e.target.id==='pname'||e.target.id==='pmail')){
    const b=document.querySelector('[data-a="saveperson"]');if(b)b.click();}
  if(e.key==='Escape'){
    if(S.addPerson){S.addPerson=false;render();return}
    if(S.menu){S.menu=null;render();return}
    if(S.share){S.share=false;render();return}
    if(S.settings){S.settings=false;render();return}
    if(S.panel){S.panel=false;render();return}
    if(S.mpanel){S.mpanel=false;render();return}
  }
  if(e.key===','&&(e.metaKey||e.ctrlKey)){e.preventDefault();S.settings=true;S.spane='appearance';render()}
});

/* ── bubble dragging ──────────────────────────────────────────────────────
   Pointer coordinates are viewport-space and the frame may be scaled, so every
   delta is divided by SCALE. A press that moves less than a few pixels is left
   alone and becomes an ordinary click; anything more sets BUBSUP so the click
   that follows mouseup is ignored. */
let BDRAG=null,BUBSUP=0;
document.addEventListener('mousedown',e=>{
  const el=$('#bubble');
  if(!el||!db.settings.bubble||!e.target.closest('#bubble'))return;
  if(e.target.closest('[data-a="bubact"]'))return;   /* tray buttons are not handles */
  const r=el.getBoundingClientRect();
  BDRAG={ox:(e.clientX-r.left)/SCALE,oy:(e.clientY-r.top)/SCALE,x0:e.clientX,y0:e.clientY,live:false};
});
document.addEventListener('mousemove',e=>{
  if(!BDRAG)return;
  if(!BDRAG.live&&Math.abs(e.clientX-BDRAG.x0)+Math.abs(e.clientY-BDRAG.y0)<4)return;
  BDRAG.live=true;
  e.preventDefault();
  const fr=$('#frame').getBoundingClientRect();
  S.bub.x=Math.max(8,Math.min((e.clientX-fr.left)/SCALE-BDRAG.ox,FW()-68));
  S.bub.y=Math.max(72,Math.min((e.clientY-fr.top)/SCALE-BDRAG.oy,FH()-76));
  const el=$('#bubble');
  if(el){el.style.left=S.bub.x+'px';el.style.top=S.bub.y+'px';el.classList.add('drag')}
});
document.addEventListener('mouseup',()=>{
  if(BDRAG&&BDRAG.live){BUBSUP=Date.now();const el=$('#bubble');if(el)el.classList.remove('drag')}
  BDRAG=null;
});

/* ══════════════════════════════════ boot / sizing ══════════════════════════════════ */
let SCALE=1,FILL=false,BOOTED=false;
const FW=()=>{const f=$('#frame');return f?f.clientWidth:1440};
const FH=()=>{const f=$('#frame');return f?f.clientHeight:900};
const clampX=(x,w)=>Math.max(8,Math.min(x,FW()-w-12));
const clampY=(y,h)=>Math.max(74,Math.min(y,FH()-h-12));

/* Two jobs:
   1. Shrink-to-fit the 1440×900 mock while there is room for it. Once the
      browser gets small enough that the mock would be scaled below FILL_AT,
      drop the window chrome and let the app fill the whole viewport instead.
   2. Auto-collapse the sidebars, in order (list column first, then the rail),
      so the main content area keeps a usable width all the way down. */
const FILL_AT=0.88, LIST_AT=1180, RAIL_AT=960;
const AUTO={list:null,rail:null};
function fit(){
  const f=$('#frame');if(!f)return;
  const vw=window.innerWidth,vh=window.innerHeight;
  const need=Math.min((vw-40)/1440,(vh-40)/900);
  FILL=S.zoom||need<FILL_AT;
  f.classList.toggle('fill',FILL);
  if(FILL){SCALE=1;f.style.transform='';}
  else{SCALE=Math.min(1,need);f.style.transform=`scale(${SCALE})`;}
  const w=FILL?vw:1440;
  f.classList.toggle('w3',w<1320);
  f.classList.toggle('w2',w<1080);
  f.classList.toggle('w1',w<840);
  let ch=false;
  const wantList=w<LIST_AT,wantRail=w<RAIL_AT;
  if(wantList!==AUTO.list){AUTO.list=wantList;S.listmin=wantList;ch=true}
  if(wantRail!==AUTO.rail){AUTO.rail=wantRail;S.railmin=wantRail;ch=true}
  if(ch&&BOOTED)render();
  else if(BOOTED)renderBubble();
}
window.addEventListener('resize',fit);
fit();render();BOOTED=true;
setTimeout(()=>toast('<b>AIT-Scribe prototype.</b> Everything is clickable — try <b>Record meeting</b>, or switch to dark mode in Settings.',5200),700);
</script>
