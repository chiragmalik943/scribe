.sw .meta .v{font-size:11px;color:var(--ter);font-family:var(--f-mono);display:block;margin-top:2px}
.sw .meta .u{font-size:11.5px;color:var(--sec);display:block;margin-top:5px;line-height:1.45}
.ramp{display:grid;grid-template-columns:repeat(9,1fr);border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);margin-top:16px}
.ramp>div{height:92px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;cursor:pointer}
.ramp>div b{font-family:var(--f-body);font-size:12px;font-weight:600}
.ramp>div.role{box-shadow:inset 0 -3px 0 currentColor}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.stc{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surf)}
.stc .hd{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:13px;font-weight:600}
.stc .rows{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair)}
.stc .rows div{height:46px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--f-mono)}
.stc .rows div+div{border-left:1px solid rgba(128,128,128,.12)}
.stc .ex{padding:11px 13px;border-top:1px solid var(--hair);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* mode matrix */
.tmx{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.tmx-c{border-radius:var(--r4);overflow:hidden;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;transition:box-shadow var(--tr),transform var(--tr)}
.tmx-c:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.tmx-c .mini{display:flex;height:150px;background:var(--surf)}
.tmx-c .mini .mr{width:56px;background:var(--rail);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.tmx-c .mini .mr i{height:8px;border-radius:3px;background:var(--line2)}
.tmx-c .mini .mr i.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--brandInk)}
.tmx-c .mini .mm{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tmx-c .foot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surf)}
.tmx-c .foot b{font-family:var(--f-head);font-size:13px;font-weight:600}
.tmx-c .foot span{font-size:11.5px;color:var(--ter)}
/* type */
.tyrow{display:grid;grid-template-columns:170px minmax(0,1fr) 210px;gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--hair)}
.tyrow:first-child{border-top:0}
.tyrow .k{font-size:12.5px;font-weight:600;color:var(--ink2)}
.tyrow .k small{display:block;font-size:11px;color:var(--ter);font-weight:500;margin-top:2px}
.tyrow .v{font-family:var(--f-mono);font-size:11px;color:var(--ter);line-height:1.6}
.tyrow .x{min-width:0;overflow:hidden;text-overflow:ellipsis}
.glyphs{font-family:var(--f-head);font-size:22px;letter-spacing:.02em;line-height:1.6;color:var(--ink2);word-break:break-all}
.bigaa{font-family:var(--f-head);font-size:132px;font-weight:600;letter-spacing:-.05em;line-height:.9;color:var(--ink)}
.weights{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.weights div{display:flex;flex-direction:column;gap:4px}
.weights div b{font-family:var(--f-head);font-size:34px;letter-spacing:-.02em;color:var(--ink)}
.weights div small{font-size:11px;color:var(--ter);font-family:var(--f-mono)}
/* scale visuals */
.scale-row{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--hair)}
.scale-row:first-child{border-top:0}
.scale-row .k{width:64px;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink2)}
.scale-row .v{width:56px;font-family:var(--f-mono);font-size:11.5px;color:var(--ter)}
.scale-row .bar{height:14px;background:var(--brand);opacity:.75;border-radius:3px}
.scale-row .u{font-size:12px;color:var(--sec);margin-left:auto;text-align:right}
.radii{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.radii>div{display:flex;flex-direction:column;gap:10px}
.radii .bx{height:104px;background:var(--tint2);border:1.5px solid var(--brand);border-top-color:var(--brand)}
.radii b{font-family:var(--f-mono);font-size:12px}
.radii small{font-size:11.5px;color:var(--sec);line-height:1.45}
.elev{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;margin-top:16px;padding:28px;background:var(--sunk);border-radius:var(--r4)}
.elev>div{height:132px;border-radius:var(--r4);background:var(--surf);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.elev b{font-family:var(--f-mono);font-size:12px}
.elev small{font-size:11.5px;color:var(--sec);line-height:1.45}
/* icons */
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:1px;background:var(--hair);border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;margin-top:16px}
.icgrid>div{background:var(--surf);height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--ink2);transition:background var(--tr),color var(--tr)}
.icgrid>div:hover{background:var(--tint2);color:var(--brandInk)}
.icgrid>div small{font-size:11px;font-family:var(--f-mono);color:var(--ter)}
.icsizes{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
/* motion */
.mo{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.mo .card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.mo .stagebox{height:150px;background:var(--sunk);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.mo .meta{padding:12px 14px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:3px}
.mo .meta b{font-size:13px;font-weight:600;font-family:var(--f-head)}
.mo .meta small{font-size:11px;font-family:var(--f-mono);color:var(--ter)}
.mo .meta p{font-size:12px;color:var(--sec);line-height:1.5;margin-top:3px}
.curve{width:100%;height:120px}
/* principles & do/dont */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.prin{border:1px solid var(--line);border-radius:var(--r4);padding:18px 18px 20px;background:var(--surf);display:flex;flex-direction:column;gap:8px}
.prin .no{font-family:var(--f-mono);font-size:11px;color:var(--ter)}
.prin>.ico{width:34px;height:34px;border-radius:var(--r3);background:var(--tint);color:var(--brandInk);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.prin b{font-family:var(--f-head);font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.prin p{font-size:12.5px;color:var(--sec);line-height:1.6}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.dd>div{border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--surf);display:flex;flex-direction:column}
.dd .h{display:flex;align-items:center;gap:7px;padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--hair)}
.dd .do .h{color:var(--okInk)} .dd .do .h:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dd .dont .h{color:var(--dangerInk)} .dd .dont .h:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--danger)}
.dd .ex{padding:22px;flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;background:var(--surf)}
.dd .why{padding:11px 14px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--sec);line-height:1.55}
/* hero */
.hero{position:relative;border-radius:var(--r5);overflow:hidden;border:1px solid var(--line);background:var(--rail);isolation:isolate}
.hero:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(900px 420px at 88% -8%,var(--tint),transparent 62%),radial-gradient(700px 360px at -6% 110%,var(--tint2),transparent 60%)}
.hero-in{padding:44px 48px 0}
.hero-in>h1{font-family:var(--f-head);font-size:44px;font-weight:600;letter-spacing:-.034em;line-height:1.06;max-width:17ch}
.hero-in>h1 em{font-style:normal;color:var(--brandInk)}
.hero-in>.sub{font-size:15px;line-height:1.65;color:var(--ink2);max-width:62ch;margin-top:16px}
.hero-in>.cta{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.hero-stats{display:flex;gap:0;margin-top:30px;flex-wrap:wrap;border-top:1px solid var(--line)}
.hero-stats>div{padding:16px 26px 16px 0;margin-right:26px;border-right:1px solid var(--hair)}
.hero-stats>div:last-child{border-right:0}
.hero-stats b{display:block;font-family:var(--f-head);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-stats small{font-size:12px;color:var(--ter)}
.hero-shot{margin:6px 48px 0;height:430px;overflow:hidden;position:relative;border-radius:var(--r4) var(--r4) 0 0}
.hero-shot .stage{box-shadow:none}
.hero-mode{position:absolute;right:48px;top:44px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hero-mode small{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter)}
/* layout stage */
.stagebar{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.stagebar .l{font-size:12px;color:var(--ter);display:flex;align-items:center;gap:6px}
.stagebar .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.stagewrap{margin-top:10px;border-radius:var(--r4);background:var(--backdrop);padding:22px;border:1px solid var(--line)}
.stage{position:relative;width:100%;overflow:hidden}
.stage>.win{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:var(--r4);overflow:hidden;background:var(--surf);
  box-shadow:0 40px 100px rgba(40,20,8,.20),0 0 0 1px rgba(40,20,8,.07)}
.stage.phone>.win{border-radius:28px}
.win{container-type:normal}
.anat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.anat>div{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r3);background:var(--surf)}
.anat .k{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surf);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.anat b{font-size:12.5px;font-weight:600;display:block}
.anat span{font-size:11.5px;color:var(--sec);display:block;margin-top:2px;line-height:1.45}
.viewer{position:fixed;inset:0;z-index:120;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:28px;animation:tin .18s}
.viewer .stage{max-width:100%}
.viewer .vx{position:absolute;right:18px;top:18px;background:var(--surf);box-shadow:var(--e2)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{border:1px solid var(--line);border-radius:var(--r3);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color var(--tr),background var(--tr)}
.pager a:hover{border-color:var(--brand);background:var(--tint2)}
.pager a small{font-size:11.5px;color:var(--ter);display:flex;align-items:center;gap:4px}
.pager a b{font-family:var(--f-head);font-size:14px;font-weight:600}
.pager a.nx{text-align:right;align-items:flex-end}
.pager a.empty{visibility:hidden}
.codeblock{border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;margin-top:16px;background:var(--sunk)}
.codeblock .hd{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--hair);background:var(--surf)}
.codeblock .hd b{font-size:12.5px;font-weight:600}
.codeblock .hd .r{margin-left:auto;display:flex;gap:4px}
.codeblock pre{font-family:var(--f-mono);font-size:11.5px;line-height:1.65;padding:14px 16px;overflow:auto;max-height:560px;color:var(--ink2);white-space:pre}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12.5px;margin-top:12px}
.kv dt{color:var(--ter)} .kv dd{color:var(--ink2)}
.checklist{list-style:none;display:flex;flex-direction:column;margin-top:12px;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden}
.checklist li{display:flex;gap:12px;padding:12px 16px;font-size:13px;line-height:1.55;color:var(--ink2);background:var(--surf)}
.checklist li+li{border-top:1px solid var(--hair)}
.checklist li>.ic{color:var(--okInk);margin-top:2px}
.checklist li b{color:var(--ink)}
.dsfoot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ter);flex-wrap:wrap}
.copied{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300}

/* showcase shell — responsive (viewport, not window) */
@media (max-width:1180px){
  #ds .app>.listcol{width:236px;flex-basis:236px}
  .hero-in>h1{font-size:38px}
  .hero-mode{display:none}
}
@media (max-width:900px){
  .menubtn{display:flex}
  #ds>.shell>.app>.rail,#ds>.shell>.app>.listcol{position:absolute;left:0;z-index:30;width:min(300px,86vw);flex-basis:auto;transform:translateX(-105%);transition:transform var(--sbT);box-shadow:var(--peekShadow)}
  #ds>.shell>.app>.rail{top:0;bottom:auto;height:auto;padding-bottom:10px;border-bottom:1px solid var(--line)}
  #ds>.shell>.app>.rail .spacer,#ds>.shell>.app>.rail .colbtn,#ds>.shell>.app>.rail .acct{display:none}
  #ds>.shell>.app>.listcol{top:var(--dh,280px);bottom:0}
  #ds>.shell>.app.drawer>.rail,#ds>.shell>.app.drawer>.listcol{transform:none}
  #ds>.shell>.app.drawer:after{content:'';position:absolute;inset:0;background:var(--scrim);z-index:25}
  #ds .topbar{gap:10px;padding:0 10px 0 12px}
  #ds .topbar .hide-sm{display:none}
  #ds .body{--bp:18px}
  .hero-in{padding:28px 22px 0}
  .hero-in>h1{font-size:30px}
  .hero-shot{margin:6px 22px 0;height:260px}
  .hero-stats>div{padding:12px 16px 12px 0;margin-right:16px}
  .dd{grid-template-columns:1fr}
  .tyrow{grid-template-columns:1fr;gap:6px}
  .stagewrap{padding:10px}
  .ramp{grid-template-columns:repeat(3,1fr)}
  .specs,.specs.two{grid-template-columns:1fr}
  .spec-demo{padding:18px;overflow-x:auto}
  .doc .table.card,.doc .card>.table{display:block;overflow-x:auto}
  .pager{grid-template-columns:1fr}
}
@media (max-width:560px){
  /* specimens on a phone follow the same rules a w1 window does */
  .doc .row{flex-wrap:wrap;gap:4px 8px}.doc .row>span:first-child{flex:1 1 100%}.doc .row .acts{display:none}
  .doc .row .rt{text-align:left;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.doc .row .rt .mt{margin:0}
  .doc .task{flex-wrap:wrap}.doc .task .due{margin-left:0;padding-left:29px;flex-basis:100%}
  .doc .statrow{flex-direction:column;gap:20px}.doc .statrow>.stat+.stat{border-left:0;padding-left:0;border-top:1px solid var(--hair);padding-top:20px}
  .doc .setuprow,.doc .srow,.doc .step{flex-wrap:wrap}.doc .srow .a,.doc .step .a,.doc .setuprow .a{margin-left:0;padding-left:0}
  .doc .compare{grid-template-columns:1fr}.doc .compare>div+div{border-left:0;border-top:1px solid var(--line2)}
  .brandmark .wm span{display:none}
  .bigaa{font-size:88px}
}
/* site-only glue */
@keyframes mdin2{from{opacity:0;transform:translateY(2%) scale(.985)}}
.marks{position:absolute;top:0;pointer-events:none}
.stagewrap{position:relative}
.stagewrap>.marks{top:22px;margin-left:22px}
.mk{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surf);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--surf),0 6px 16px rgba(0,0,0,.25)}
.hero-shot .stage>.win{box-shadow:0 30px 80px -20px rgba(16,24,40,.35),0 0 0 1px var(--line)}
.ramp>div span{opacity:.85}
.win .tip{display:none}
</style>

/* Optical stroke: an SVG scales its stroke with its viewBox, so a fixed 1.7-unit stroke is a
   hairline at 11px and heavy at 32px. ic() picks the stroke it wants on screen, in px, and
   converts it back to grid units:  px = 1.7 · √(size ÷ 16). The optional third argument is a
   rendered stroke in px, for emphasis (a check in a checkbox, a glyph on a brand fill). */
const strokePx=s=>1.7*Math.sqrt(s/16);
const ic=(n,s=16,px)=>{const w=Math.round((px==null?strokePx(s):px)*16/s*1000)/1000;
  return `<svg class="ic" data-i="${n}" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

function hash(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(key){let a=hash(key);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const L={
  w(n,k){const r=rng('w'+k+n);return Array.from({length:n},()=>LW[Math.floor(r()*LW.length)]).join(' ')},
  t(n,k){return cap(L.w(n,k))},                               /* sentence-case title */
  s(n,k){return cap(L.w(n,k))+'.'},                           /* one sentence */
  p(n,k,len=14){return Array.from({length:n},(_,i)=>L.s(len-3+((hash(k+i)%7)),k+'.'+i)).join(' ')},

function motionDemo(d){
  switch(d){
  case 'hover':return `<span class="btn s">Hover me</span><span class="btn p" style="margin-left:8px">And me</span>`;
  case 'aside':return `<div style="width:80%;height:100px;border:1px solid var(--line);border-radius:10px;background:var(--surf);display:flex;justify-content:flex-end;overflow:hidden"><div class="mv" style="width:40%;border-left:1px solid var(--line);background:var(--surf);animation:asideIn .26s cubic-bezier(.32,.72,0,1) both;padding:10px"><div style="height:8px;width:60%;border-radius:3px;background:var(--line2)"></div><div style="height:6px;width:80%;border-radius:3px;background:var(--hair);margin-top:8px"></div></div></div>`;
  case 'modal':return `<div class="mv" style="width:150px;height:84px;border-radius:var(--r5);background:var(--surf);box-shadow:var(--e3);animation:mdin2 .18s var(--pop)"></div>`;
  case 'menu':return `<div class="menu static mv" style="min-width:150px;animation:mnin .12s ease-out">${K.menuItems([{i:'edit',l:'Lorem'},{i:'copy',l:'Ipsum'},{i:'trash',l:'Dolor',dg:1}])}</div>`;
  case 'toast':return `<div class="toast ok mv" style="animation:tin .2s">${ic('check',15)}<span><b>Lorem.</b> Ipsum dolor.</span></div>`;
  case 'notif':return `<div class="notif mv" style="width:220px;padding:10px"><span class="ai" style="width:26px;height:26px">${ic('bell',14)}</span><span class="bd"><span class="ti" style="margin:0;font-size:12.5px">Lorem ipsum</span><span class="bo" style="font-size:11.5px">Dolor sit amet.</span></span></div>`;
  case 'peek':return `<div style="width:80%;height:100px;border:1px solid var(--line);border-radius:10px;background:var(--surf);position:relative;overflow:hidden"><div class="mv" style="position:absolute;left:0;top:0;bottom:0;width:45%;background:var(--rail);box-shadow:var(--peekShadow),1px 0 0 var(--line2);animation:pkslide .17s var(--pop)"></div></div>`;
  case 'pill':return `<div class="pill mv" style="height:44px"><span class="pstat"><i class="rdot"></i><b style="font-size:13px">02:14</b></span>${K.pmeter(7,2)}<span class="pbtn stop" style="width:30px;height:30px">${ic('stop',12,1.75)}</span></div>`;
  case 'pulse':return `<span class="livebar" style="padding:9px 14px"><span class="rdot"></span><b>Live</b><span class="t">00:42</span></span>`;
  case 'typing':return `<div class="msg a" style="margin:0"><span class="who">${ic('spark',15,2)}</span><span class="tx typing"><i></i><i></i><i></i></span></div>`;}
  return '';
}

function fitStage(st){const win=st.firstElementChild;if(!win)return;const w=+st.dataset.w,h=+st.dataset.h||900;
  const avail=st.clientWidth;if(!avail)return;const k=Math.min(1,avail/w);
  win.style.transform=`scale(${k})`;st.style.height=Math.round(h*k)+'px';
  if(w*k<avail-1){win.style.left=Math.round((avail-w*k)/2)+'px'}else win.style.left='0';
  const mk=st.parentElement&&st.parentElement.querySelector('.marks');if(mk){mk.style.width=Math.round(w*k)+'px';mk.style.height=Math.round(h*k)+'px';mk.style.left=(parseFloat(win.style.left)||0)+'px'}}

function hydrate(){
  $$('[data-var]').forEach(el=>{const v=cv(el,el.dataset.var);el.textContent=v.toUpperCase().startsWith('#')?v.toUpperCase():v});
  $$('[data-fg]').forEach(el=>{const c=parseColor(cv(el,el.dataset.fg));if(c){const bg=parseColor(cv(el,'--surf'))||[255,255,255,1];const cc=blend(c,bg);el.style.color=lum(cc)>.4?'rgba(0,0,0,.62)':'rgba(255,255,255,.86)';el.textContent=''}});
  $$('[data-fgbox]').forEach(el=>{const c=parseColor(cv(el,el.dataset.fgbox));if(c)el.style.color=lum(c)>.4?'rgba(0,0,0,.7)':'rgba(255,255,255,.9)'});
  const t=$('#contrast tbody');
  if(t){const root=document.documentElement;const pairs=[['ink','surf',4.5],['ink2','surf',4.5],['sec','surf',4.5],['ter','surf',4.5],['ter','sunk',4.5],['ter','rail',4.5],['brandInk','surf',4.5],['brandInk','tint',4.5],['brandOn','brandFill',4.5],['dangerInk','surf',4.5],['dangerInk','dangerTint',4.5],['warnInk','warnTint',4.5],['okInk','okTint',4.5],['infoInk','infoTint',4.5],['dangerOn','danger',3],['brand','surf',3],['line2','surf',1.3],['pillInk','pill',4.5]];
    t.innerHTML=pairs.map(([f,b,need])=>{const bg=parseColor(cv(root,'--'+b)),fg0=parseColor(cv(root,'--'+f));if(!bg||!fg0)return '';const r=ratio(blend(fg0,bg),bg);const pass=r>=need;
      return `<tr><td><code>--${f}</code> on <code>--${b}</code></td><td><span style="display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;background:var(--${b});color:var(--${f});font-weight:600;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--hair)">Lorem ipsum</span></td>
      <td class="num"><b>${r.toFixed(2)}</b> : 1</td><td>${need===1.3?'boundary':need+' : 1'}</td><td>${pass?`<span class="tag ok">${ic('check',11,1.75)}Pass</span>`:`<span class="pri hi">Check</span>`}</td></tr>`}).join('')}
}
function fillTokens(){const a=$('#tokcode'),b=$('#compcode');const t=$('#ds-tokens').textContent.trim(),c=$('#ds-components').textContent.trim();
  if(a){a.textContent=t;$('#toklen').textContent=Math.round(t.length/1024)+' KB'}if(b){b.textContent=c;$('#complen').textContent=Math.round(c.length/1024)+' KB'}}

/* ═══════════════════════════ markup viewer ═══════════════════════════ */
const VOID=new Set(['input','br','hr','img','meta']);
function fmtNode(n,d){const pad='  '.repeat(d);
  if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();return t?pad+esc(t)+'\n':''}
  if(n.nodeType!==1)return '';const tag=n.tagName.toLowerCase();
  const attrs=[...n.attributes].filter(a=>!['tabindex','aria-label','aria-hidden','role','aria-checked','aria-current','aria-selected'].includes(a.name)||(a.name==='role'&&!['button','link'].includes(a.value))).map(a=>{const nm=a.name==='data-tt'?'title':a.name;return ` <span class="at">${nm}</span>=<span class="av">"${esc(a.value)}"</span>`}).join('');
  if(tag==='svg'){const nm=n.dataset.i||'';return `${pad}<span class="tg">&lt;svg</span> <span class="at">class</span>=<span class="av">"ic"</span> <span class="cm">${nm?'/* '+nm+' · '+(n.getAttribute('width')||16)+'px */':''}</span><span class="tg">/&gt;</span>\n`}
  const open=`<span class="tg">&lt;${tag}</span>${attrs}<span class="tg">&gt;</span>`;
  if(VOID.has(tag))return pad+open+'\n';
  const kids=[...n.childNodes].filter(c=>!(c.nodeType===3&&!c.textContent.trim()));
  if(!kids.length)return `${pad}${open}<span class="tg">&lt;/${tag}&gt;</span>\n`;
  if(kids.length===1&&kids[0].nodeType===3&&kids[0].textContent.length<70)return `${pad}${open}${esc(kids[0].textContent.trim())}<span class="tg">&lt;/${tag}&gt;</span>\n`;
  return `${pad}${open}\n${kids.map(c=>fmtNode(c,d+1)).join('')}${pad}<span class="tg">&lt;/${tag}&gt;</span>\n`;
}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
function codeFor(spec){const demo=$('.spec-demo',spec);return [...demo.childNodes].map(c=>fmtNode(c,0)).join('')}

/* ═══════════════════════════ tooltip ═══════════════════════════ */
function tips(root){if(!root)return;
  $$('[title]',root).forEach(el=>{const t=el.getAttribute('title');el.removeAttribute('title');if(!t)return;el.setAttribute('data-tt',t);if(!el.getAttribute('aria-label'))el.setAttribute('aria-label',t)});
  $$('.tbtn,.colbtn,.fchip,.seg span,.tog,.cbx,.rdo,.tile,.tile-sm,.hopt,.pbtn,.fab-core,.views a,.nav a,.tabs a,.mnav a,.tmx-c,.sw,.icgrid>div,.acts span,.fm,.tw:not(.blank),[data-nav],.replay,.crumb .bk,.menu a,.chip,.prompts span,.src,.link,.sendb,.addp,.sel,.opt,.pager a',root).forEach(el=>{
    if(['BUTTON','INPUT','TEXTAREA'].includes(el.tagName)||el.isContentEditable)return;if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');if(!el.hasAttribute('role'))el.setAttribute('role','button')});
}
const TIP={el:null,t:null,warm:0};
function tipShow(el){const t=$('#tip');t.textContent=el.dataset.tt;t.className='tip on';const r=el.getBoundingClientRect(),tw=t.offsetWidth,th=t.offsetHeight;
  let y=r.top-th-8;if(y<6)y=r.bottom+8;const x=Math.max(6,Math.min(r.left+r.width/2-tw/2,innerWidth-tw-6));t.style.left=Math.round(x)+'px';t.style.top=Math.round(y)+'px'}
function tipHide(){clearTimeout(TIP.t);if(TIP.el){TIP.el=null;TIP.warm=Date.now()}const t=$('#tip');if(t)t.className='tip'}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tt]');if(el===TIP.el)return;tipHide();if(!el)return;
  /* an expanded sidebar already shows its labels */
  const bar=el.closest('.rail,.listcol');if(bar){const app=bar.parentElement;const min=bar.classList.contains('rail')?app.classList.contains('railmin'):app.classList.contains('listmin');if(!min&&el.matches('.nav a,.views a,.acct'))return}
  TIP.el=el;TIP.t=setTimeout(()=>{if(TIP.el===el)tipShow(el)},Date.now()-TIP.warm<450?0:340)});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tt]');if(el&&el===TIP.el&&!(e.relatedTarget&&el.contains(e.relatedTarget)))tipHide()});
document.addEventListener('mousedown',tipHide,true);document.addEventListener('scroll',tipHide,true);

/* ═══════════════════════════ hover peek ═══════════════════════════ */
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
let PK={bar:null,t:null,close:null,x:0,y:0,lx:0,ly:0,ms:0};
document.addEventListener('mousemove',e=>{PK.x=e.clientX;PK.y=e.clientY},{passive:true});
function peekable(bar){if(!bar)return false;const app=bar.parentElement;if(!app||!app.classList.contains('app')||app.classList.contains('drawer'))return false;
  if(innerWidth<=900&&app.id==='dsapp')return false;return bar.classList.contains('rail')?app.classList.contains('railmin'):app.classList.contains('listmin')}
function peekOpen(bar){const app=bar.parentElement,r=bar.classList.contains('rail');
  const rl=app.querySelector(':scope>.rail');app.style.setProperty('--railw',(rl?rl.offsetWidth:72)+'px');
  app.classList.remove(r?'railmin':'listmin');app.classList.add(r?'pkrail':'pklist','pkin');bar.dataset.peek='1';
  const cb=bar.querySelector('.colbtn');if(cb)cb.classList.add('pin');setTimeout(()=>app.classList.remove('pkin'),200)}
function peekClose(bar){const app=bar.parentElement,r=bar.classList.contains('rail');if(!bar.dataset.peek)return;delete bar.dataset.peek;
  app.classList.remove(r?'pkrail':'pklist');app.classList.add(r?'railmin':'listmin');const cb=bar.querySelector('.colbtn');if(cb)cb.classList.remove('pin')}
document.addEventListener('mouseover',e=>{if(!FINE)return;const bar=e.target.closest&&e.target.closest('.app>.rail,.app>.listcol');
  if(PK.bar&&PK.bar.dataset.peek&&bar!==PK.bar){const b=PK.bar;clearTimeout(PK.close);PK.close=setTimeout(()=>{peekClose(b);if(PK.bar===b)PK.bar=null},420)}
  if(bar&&bar.dataset.peek){clearTimeout(PK.close);PK.bar=bar;return}
  if(!bar){clearInterval(PK.t);PK.t=null;return}
  if(!peekable(bar)||PK.t&&PK.bar===bar)return;
  clearInterval(PK.t);PK.bar=bar;PK.ms=0;PK.lx=PK.x;PK.ly=PK.y;
  PK.t=setInterval(()=>{PK.ms+=100;const moved=Math.abs(PK.x-PK.lx)+Math.abs(PK.y-PK.ly);PK.lx=PK.x;PK.ly=PK.y;
    const over=document.elementFromPoint(PK.x,PK.y);if(!over||!bar.contains(over)){clearInterval(PK.t);PK.t=null;return}
    if(PK.ms>=350&&moved<9){clearInterval(PK.t);PK.t=null;if(peekable(bar))peekOpen(bar)}},100)});

/* ═══════════════════════════ interactions ═══════════════════════════ */
function flash(msg){const d=document.createElement('div');d.className='copied';d.innerHTML=K.toast('ok','check','Copied.',msg);document.body.appendChild(d);setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';setTimeout(()=>d.remove(),320)},1600)}
function copy(t,msg){const done=()=>flash(msg||'On your clipboard.');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(fb);else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}
function scopeOf(el){return el.closest('.win')||el.closest('.spec')||document}
function switchPanes(el,key,t){const sc=scopeOf(el);$$(`[data-of="${key}"]`,sc).forEach(p=>p.classList.toggle('hidden',p.dataset.t!==t))}
document.addEventListener('click',e=>{
  const T=e.target;let el;
  if((el=T.closest('[data-nav]'))){e.preventDefault();go(el.dataset.nav);return}
  if((el=T.closest('[data-menu]'))){const a=$('#dsapp');a.classList.remove('railmin');a.classList.toggle('drawer');const r=$('#dsapp>.rail');if(r)a.style.setProperty('--dh',r.offsetHeight+'px');return}
  if(T.id==='dsapp'||(T.closest('#dsapp')&&$('#dsapp').classList.contains('drawer')&&!T.closest('.rail,.listcol'))){$('#dsapp').classList.remove('drawer')}
  if((el=T.closest('.modeseg span[data-mode]'))){setTheme(el.dataset.mode);return}
  if((el=T.closest('[data-setmode]'))&&!T.closest('.win')){setTheme(el.dataset.setmode);return}
  if((el=T.closest('.codebtn'))){const sp=el.closest('.spec');const pre=$('.spec-code pre',sp);if(!sp.classList.contains('showcode'))pre.innerHTML=codeFor(sp);sp.classList.toggle('showcode');el.classList.toggle('on');return}
  if((el=T.closest('.copybtn'))){copy(plain(codeFor(el.closest('.spec'))),'Markup for this specimen.');return}
  if((el=T.closest('[data-copyfrom]'))){copy($(el.dataset.copyfrom).textContent);return}
  if((el=T.closest('[data-download]'))){const k=el.dataset.download;const txt=$(k==='tokens'?'#ds-tokens':'#ds-components').textContent.trim();const b=new Blob([txt],{type:'text/css'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=k+'.css';document.body.appendChild(a);a.click();a.remove();return}
  if((el=T.closest('[data-copyicon]'))){copy(ic(el.dataset.copyicon).replace(/ data-i="[^"]*"/,''),`The ${el.dataset.copyicon} icon.`);return}
  if((el=T.closest('[data-copy]'))){copy(el.dataset.copy,el.dataset.copy);return}
  if((el=T.closest('[data-expand]'))){expand(el.dataset.expand);return}
  if((el=T.closest('.replay'))){const box=el.closest('.card').querySelector('.stagebox');box.innerHTML=motionDemo(box.dataset.demo);return}
  if((el=T.closest('[data-stagew] span[data-w]'))){const seg=el.parentElement;$$('span',seg).forEach(s=>s.classList.toggle('on',s===el));const st=$('#st-'+seg.dataset.stagew);st.dataset.h=+el.dataset.w<840?1100:900;buildStage(st,+el.dataset.w);return}
  if((el=T.closest('.colbtn[data-col]'))){const app=el.closest('.app'),bar=el.closest('.rail,.listcol');
    if(bar&&bar.dataset.peek){delete bar.dataset.peek;app.classList.remove('pkrail','pklist');el.classList.remove('pin');if(app.id==='dsapp'){S.railmin=false;store.set('ds-rail','0')}return}
    const k=el.dataset.col==='rail'?'railmin':'listmin';app.classList.toggle(k);if(app.id==='dsapp'){S.railmin=app.classList.contains('railmin');S.userRail=S.railmin;store.set('ds-rail',S.railmin?'1':'0')}
    const on=app.classList.contains(k);el.innerHTML=ic(on?'panelR':'panelL',17);el.dataset.tt=on?'Expand':'Collapse';tipHide();return}
  if((el=T.closest('.tw[data-tree]'))){e.stopPropagation();el.classList.toggle('o');const open=el.classList.contains('o');$$(`[data-of="${el.dataset.tree}"]`,el.closest('.views')).forEach(s=>s.classList.toggle('hidden',!open));return}
  if((el=T.closest('.tabs a[data-t]'))&&!el.classList.contains('off')){const tabs=el.parentElement;$$('a',tabs).forEach(a=>a.classList.toggle('on',a===el));if(tabs.dataset.tabs)switchPanes(el,tabs.dataset.tabs,el.dataset.t);return}
  if((el=T.closest('.mnav[data-tabs] a[data-t]'))){const nav=el.parentElement;$$('a',nav).forEach(a=>a.classList.toggle('on',a===el));switchPanes(el,nav.dataset.tabs,el.dataset.t);return}
  if((el=T.closest('.seg span'))&&!el.closest('.modeseg,[data-stagew]')){const seg=el.parentElement;$$('span',seg).forEach(s=>s.classList.toggle('on',s===el));if(seg.dataset.seg)switchPanes(el,seg.dataset.seg,el.dataset.t);return}
  if((el=T.closest('.tog'))&&!el.classList.contains('dis')){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));return}
  if((el=T.closest('.cbx'))){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));const t=el.closest('.task');if(t)t.classList.toggle('done',el.classList.contains('on'));return}
  if((el=T.closest('.opt'))){const g=el.parentElement;$$(':scope>.opt',g).forEach(o=>{o.classList.toggle('on',o===el);const r=$('.rdo',o);if(r)r.classList.toggle('on',o===el)});return}
  if((el=T.closest('.fchip'))&&!el.closest(".tmx-c")){const sib=[...el.parentElement.children].filter(x=>x.classList.contains('fchip'));if(sib.length>1)sib.forEach(s=>s.classList.toggle('on',s===el));return}
  if((el=T.closest('.convrow'))){$$('.convrow',el.parentElement).forEach(c=>c.classList.toggle('on',c===el));return}
  if((el=T.closest('.secmore'))){el.classList.toggle('open');el.firstElementChild.textContent=el.classList.contains('open')?'Show less':'View all 7';return}
  if((el=T.closest('.task,.flag'))&&el.closest('.win,.spec')&&!T.closest('.acts,.kb2')){$$(el.classList.contains('task')?'.task':'.flag',el.closest('.list,.band')||el.parentElement).forEach(x=>x.classList.toggle('on',x===el));return}
});
document.addEventListener('input',e=>{if(e.target.id==='dsq'){S.q=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const v=$('.viewer');if(v)v.remove();$('#dsapp')&&$('#dsapp').classList.remove('drawer')}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&!e.target.isContentEditable){e.preventDefault();e.target.click()}
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){const q=$('#dsq');if(q){e.preventDefault();q.focus()}}
});
function autoRail(){const app=$('#dsapp');if(!app)return;if(innerWidth<=900){app.classList.remove('railmin');return}const want=innerWidth<1240;
  if(S.userRail===null){app.classList.toggle('railmin',want);S.railmin=want}}
addEventListener('resize',()=>{autoRail();$$('.stage').forEach(fitStage)});

/* ═══════════════════════════ boot ═══════════════════════════ */
(function boot(){
  const mode=store.get('ds-mode');const r=document.documentElement;
  r.dataset.theme=mode||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const ur=store.get('ds-rail');if(ur!==null){S.userRail=ur==='1';S.railmin=S.userRail}
  const [gid,pid]=location.hash.replace(/^#\/?/,'').split('/');const g=GROUPS.find(x=>x.id===gid);
  if(g){S.g=g.id;S.p=(g.pages.find(x=>x.id===pid)||g.pages[0]).id}
  renderShell();autoRail();renderPage();tips($('#ds'));
})();
</script>
